#stick::after{content:"▼";position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;color:rgba(255,255,255,.45);}

const keys={},pressed={};
const MAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ArrowDown:'down',KeyS:'down',
  ShiftLeft:'dash',ShiftRight:'dash',KeyK:'dash',ControlLeft:'fire',ControlRight:'fire',KeyF:'fire',KeyJ:'fire',KeyB:'shop',KeyN:'reset',Enter:'start',NumpadEnter:'start',Escape:'pause',KeyP:'pause',KeyM:'mute'};
addEventListener('keydown',e=>{const a=MAP[e.code];if(!a)return;e.preventDefault();if(!keys[a])pressed[a]=true;keys[a]=true;initAudio();});
addEventListener('keyup',e=>{const a=MAP[e.code];if(a)keys[a]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();initAudio();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('on');};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);
});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;
if(stick){
  const setDir=(dx,dy)=>{const l=dx<-14,r=dx>14,d=dy>34&&Math.abs(dy)>Math.abs(dx)*.7;if(l&&!keys.left)pressed.left=true;if(r&&!keys.right)pressed.right=true;keys.left=l;keys.right=r;if(d&&!keys.down)pressed.down=true;keys.down=d;
    const m=Math.hypot(dx,dy),k=m>46?46/m:1;if(knob)knob.style.transform='translate('+(dx*k)+'px,'+(dy*k)+'px)';stick.classList.toggle('on',l||r||d);};
  const pos=e=>{const b=stick.getBoundingClientRect();setDir(e.clientX-(b.left+b.width/2),e.clientY-(b.top+b.height/2));};
  stick.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();stickId=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(_){}pos(e);});
  stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId){e.preventDefault();pos(e);}});
  const end=e=>{if(e.pointerId!==stickId)return;stickId=null;keys.left=keys.right=keys.down=false;if(knob)knob.style.transform='';stick.classList.remove('on');};
  stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);stick.addEventListener('lostpointercapture',end);
}

let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(type,f0,f1,dur,vol=.1,delay=0){const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol=.2,f=800){const t=AC.currentTime;const b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=AC.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start(t);}

 coin:()=>{tone('square',988,988,.07,.06);tone('square',1319,1319,.16,.06,.07);},
 stomp:()=>tone('triangle',420,90,.18,.2),hurt:()=>tone('sawtooth',500,90,.35,.1),

 power:()=>[523,659,784,1047].forEach((f,i)=>tone('square',f,f,.1,.06,i*.08)),

/* ---- générateurs : chaque passage est différent ---- */
const ri=(R,a,b)=>a+Math.floor(R()*(b-a+1));
const pickA=(R,a)=>a[Math.floor(R()*a.length)];
function grid(w){return Array.from({length:ROWS},()=>Array(w).fill(' '));}
function gcol(g,x,top,ch='#'){if(x<0||x>=g[0].length)return;for(let y=top;y<ROWS;y++)g[y][x]=ch;}
const gout=g=>g.map(r=>r.join(''));
const foe=n=>{const t=['g'];if(n>=2)t.push('h');if(n>=6)t.push('s');if(n>=9)t.push('z');return t;};
function gHills(R,n){
  const w=ri(R,20,28),g=grid(w);let h=13,x=0,prevPit=false;
  while(x<w){
    if(x>3&&x<w-7&&!prevPit&&R()<.3){const pw=ri(R,2,3);if(R()<.5)g[h-3][x+1]='o';x+=pw;prevPit=true;continue;}
    const len=Math.min(ri(R,3,6),w-x);
    let nh=x===0?ri(R,12,13):Math.max(9,Math.min(13,h+ri(R,-2,2)));if(prevPit)nh=Math.max(h-1,Math.min(h+1,nh));
    for(let i=0;i<len;i++)gcol(g,x+i,nh);
    const r=R(),mid=x+Math.floor(len/2);
    if(r<.3){for(let i=0;i<len;i+=2)g[nh-2][x+i]='o';}
    else if(r<.5&&len>=4)g[nh-1][x+1+Math.floor(R()*(len-2))]=pickA(R,foe(n));
    else if(r<.62)g[nh-4][mid]=R()<.3?'!':'?';
    else if(r<.72)g[nh-5][mid]='*';
    else if(r<.8)g[nh-4][mid]='i';
    h=nh;x+=len;prevPit=false;
  }
  return gout(g);
}
function gPits(R,n){
  const w=ri(R,18,26),g=grid(w);let x=0;
  while(x<w){
    const gl=Math.min(ri(R,2,5),w-x);for(let i=0;i<gl;i++)gcol(g,x+i,13);
    if(gl>=4&&R()<.5)g[12][x+1+Math.floor(R()*(gl-2))]=pickA(R,foe(n));
    x+=gl;if(x>=w-3)break;
    const pw=ri(R,2,n>=3?5:3);
    if(pw>=4){const px=x+Math.floor(pw/2)-1;g[10][px]=g[10][px+1]='-';g[8][px]='o';g[8][px+1]=R()<.3?'*':'o';}
    else g[10][x+Math.floor(pw/2)]='o';
    x+=pw;
  }
  for(let i=x;i<w;i++)gcol(g,i,13);
  return gout(g);
}
function gSpikes(R,n){
  const w=ri(R,20,28),g=grid(w);for(let x=0;x<w;x++)gcol(g,x,13);let x=3;
  while(x<w-5){
    if(R()<.6){const sl=Math.min(ri(R,2,n>=8?6:4),w-x-3);for(let i=0;i<sl;i++)g[12][x+i]='^';
      if(sl>=4){const px=x+Math.floor(sl/2)-1;for(let i=0;i<3;i++)g[9][px+i]='-';g[8][px+1]=R()<.3?'*':'o';}else g[9][x+Math.floor(sl/2)]='o';
      x+=sl+ri(R,2,3);}
    else{const bh=ri(R,1,2);gcol(g,x,13-bh);gcol(g,x+1,13-bh);if(n>=6&&R()<.5)g[12-bh][x]='s';x+=4;}
  }
  return gout(g);
}
function gCrumble(R,n){
  const segs=ri(R,2,4),plan=[];let x=3;
  for(let i=0;i<segs;i++){const len=ri(R,2,4),gap=i?ri(R,1,2):1;plan.push([x+gap,len,ri(R,10,12)]);x+=gap+len;}
  const w=x+5,g=grid(w);for(let c=0;c<3;c++)gcol(g,c,13);for(let c=w-3;c<w;c++)gcol(g,c,13);

function gCoral(R,n){const w=ri(R,20,28),g=wbase(w);let x=3,hi=R()<.5;

function crateCollide(prevB){

    const left=p.x+p.w/2<c.x+c.w/2;
    const push=left?(p.x+p.w)-c.x:-(c.x+c.w-p.x);
    const svy=c.vy;c.vy=0;c.vx=push;moveEnt(c,false);c.vx=0;c.vy=svy;
    p.x=left?c.x-p.w:c.x+c.w;

  for(const j of jets){j.t++;const ph=j.t%160;

    if(ph>=115&&S==='play'&&overlap(P,{x:j.x+6,y:j.y-64,w:20,h:92}))hurt();}
  for(const w of saws){w.x=w.ox+Math.sin(frame*.03+w.ph)*3*T;w.y=w.oy;if(S==='play'&&Math.hypot(px-w.x,py-w.y)<22)hurt();}

function updateWorldState(){

        if(boss&&q.life>0&&!['dead','intro','sleep'].includes(boss.st)&&overlap(q,boss)){damageBoss(1,20);q.life=0;}

        if(frame%2===0)parts.push({x:q.x+q.w/2,y:q.y+q.h,vx:0,vy:-1.5,life:12,max:12,col:q.tint==='ice'?'#bfe9ff':'#ffb347',size:4,g:0});

function damageBoss(d,inv=45){
  const b=boss;if(b.inv>0||b.st==='dead')return;
  b.hp-=d;b.inv=inv;b.flash=10;shake=Math.max(shake,6);sfx('bosshit');
  puff(b.x+b.w/2,b.y+10,14,'#ffb347',4,24,5,.1);
  if(!b.mini&&!b.rage&&b.hp<=b.max/2){b.rage=true;msg={t:b.name.split(',')[0]+" S'ENRAGE !",n:120};}
  if(b.hp<=0){b.hp=0;b.st='dead';b.t=170;projs=projs.filter(q=>!['bfire','wave','rock','bul'].includes(q.k));sfx('boom');}
}
function nextAttack(b){const r=Math.random();
  if(r<.36){b.st='leap';b.vy=-15;b.vx=clamp((P.x-b.x)/48,-7,7);b.air=true;}
  else if(r<.7){b.st='throw';b.t=70;b.vx=0;}
  else{b.st='wind';b.t=36;b.vx=0;b.face=P.x+P.w/2<b.x+b.w/2?-1:1;}
}
function updateBoss(){
  const b=boss;if(!b)return;
  if(b.flash>0)b.flash--;
  if(b.st==='dead'){b.t--;if(frame%4===0){puff(b.x+Math.random()*b.w,b.y+Math.random()*b.h,10,['#ffb347','#ff5a2a','#fff3b0'][frame%3],4,30,6,0);sfx('bump');}
    if(b.t<=0){boss=null;gainLife();
      if(!LEVELS[LV-1].mini&&((save.fl[LV]||0)&3)!==3){save.fl[LV]=3;save.flowers=(save.flowers||0)+2;msg={t:"+2 FLEURS D'OR",n:120};}
      completeLevel();
      if(b.kind==='magma'||b.kind==='star'){S='victory';vicT=0;vicKind=b.kind;sfx('win');}else{S='clear';clearT=0;sfx('win');}}
    return;}
  if(b.st==='sleep'){b.vx=0;if(!inRoom&&P.x>b.ax+2*T&&P.x<b.ax+W){const gx=Math.round(b.ax/T);for(let y=1;y<=12;y++)G[y+OY][gx]='#';b.st='intro';b.t=110;msg={t:b.name,n:110};shake=8;sfx('boom');}return;}
  if(b.inv>0)b.inv--;
  const sp=(b.rage?1.4:1)*b.sp,tint=b.kind==='ice'?'ice':b.kind==='star'?'star':null;
  b.vy=Math.min(b.vy+.6,14);
  switch(b.st){
    case 'intro':b.vx=0;if(--b.t<=0){b.st='walk';b.t=90;}break;
    case 'walk':b.face=P.x+P.w/2<b.x+b.w/2?-1:1;b.vx=b.face*1.4*sp;if(--b.t<=0)nextAttack(b);break;
    case 'leap':break;
    case 'throw':b.face=P.x+P.w/2<b.x+b.w/2?-1:1;
      if(b.t===40){const n=b.mini?2:(b.rage?5:3)+(b.kind==='star'?1:0);for(let i=0;i<n;i++){const vx=(P.x-b.x)/70+(i-(n-1)/2)*1.4;projs.push({k:'bfire',tint,x:b.x+b.w/2-9,y:b.y-6,w:18,h:18,vx:clamp(vx,-8,8),vy:-9-Math.random()*2,life:300});}sfx('fire');}
      if(--b.t<=0){b.st='rest';b.t=Math.round(40/sp);}break;
    case 'wind':b.vx=0;if(--b.t<=0)b.st='charge';break;
    case 'charge':b.vx=b.face*8.5*sp;if(frame%2===0)parts.push({x:b.x+b.w/2-b.face*30,y:b.y+b.h-6,vx:-b.face,vy:-1,life:16,max:16,col:'#ffb347',size:6,g:0});break;
    case 'stun':b.vx=0;if(--b.t<=0){b.st='walk';b.t=70;}break;
    case 'rest':b.vx=0;if(--b.t<=0){b.st='walk';b.t=50+Math.floor(Math.random()*50);}break;
  }
  moveEnt(b,false);
  if(b.st==='leap'&&b.onGround&&b.air){b.air=false;b.vx=0;shake=12;sfx('boom');
    for(const s of [-1,1])projs.push({k:'wave',tint,x:b.x+b.w/2-10,y:b.y+b.h-24,w:20,h:24,vx:s*4.5*sp,life:220});
    b.st='rest';b.t=Math.round(50/sp);}
  if(b.st==='charge'&&b.hitX){b.st='stun';b.t=95;shake=12;sfx('boom');
    for(let i=0;i<(b.mini?1:(b.rage?4:2));i++)projs.push({k:'rock',tint,x:b.ax+64+Math.random()*(W-160),y:OY*T+34,w:24,h:24,vy:0,warn:40+i*12,life:400});}
  if(b.rage){if(--b.rockT<=0){b.rockT=b.kind==='star'?80:110;projs.push({k:'rock',tint,x:clamp(P.x-2+(Math.random()-.5)*80,b.ax+40,b.ax+W-70),y:OY*T+34,w:24,h:24,vy:0,warn:55,life:400});}}
  if(S==='play'&&b.st!=='intro'&&overlap(P,b)){
    const prevB=P.y+P.h-P.vy;
    if(P.pound===2){damageBoss(4);P.pound=0;P.vy=-12;P.jumps=maxAir();}
    else if(P.vy>0&&prevB<=b.y+16){damageBoss(3);P.vy=-12;P.jumps=maxAir();P.dashes=has('sdash')?2:1;sfx('stomp');}
    else if(P.dashT>0||P.charge>0){damageBoss(2);P.dashT=0;P.charge=0;P.vx=-P.face*7;P.vy=-6;P.inv=Math.max(P.inv,30);}
    else{hurt();P.vx=(P.x<b.x?-1:1)*6;}
  }
}

  }

  let tx;

function buy(){

  else msg={t:it.id==='key'?it.name+' obtenue !':it.name+' obtenu (2 bonus déjà actifs)',n:100};

}

function panel(y,h){ctx.fillStyle='rgba(18,10,26,.85)';ctx.fillRect(0,y,W,h);ctx.fillStyle='#ffb347';ctx.fillRect(0,y,W,3);ctx.fillRect(0,y+h-3,W,3);}

const NODES=[];for(let i=0;i<30;i++){const row=Math.floor(i/10),k=i%10;NODES.push([row===1?885-k*90:75+k*90,108+row*100-((k%2)?14:0)]);}
function drawMap(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1d45');g.addColorStop(1,'#5c3a52');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const n=NODES[mapSel-1];const sv=P;P={dummy:1,x:0,y:0,w:20,h:28,vx:0,vy:0,face:1,onGround:true,squash:0,inv:0,power:save.pw,dashT:0,pound:0,wall:0};drawPip(P,n[0],n[1]-20-Math.abs(Math.sin(tick*.12))*6);P=sv;

  txt('Niveau '+mapSel+' · '+L.name,W/2,H-64,13,'#fff','center');
  let sub=(isTouch?'◀ ▶ choisir · touche pour jouer · POUV. : boutique':'← → choisir · Entrée : jouer')+'   Vies ×'+lives+'   Pièces ×'+coins;
  if(save.u>25&&!owns('key'))sub="Le monde final demande la Clé des Étoiles (boutique)";

function render(){

let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){update();acc-=STEP;}render();requestAnimationFrame(loop);}
cv.focus();requestAnimationFrame(loop);
