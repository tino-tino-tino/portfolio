<title>Genèse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : écran unique — barre du haut, carte encadrée avec dock d'outils dessous, chroniques à droite (tiroir sur mobile) */
:root{
  --bg:#10151a; --panel:#171f26; --panel2:#1e2830; --line:#2a3741; --fg:#ece4d2; --muted:#8e9ba2;
  --gold:#f2b84b; --gold-soft:rgba(242,184,75,.14); --war:#e2604d; --peace:#7cc576; --sea:#14305a; --veil:rgba(16,21,26,.92);
  --display:"Pixelify Sans", ui-monospace, monospace;
  --body:"Chivo", system-ui, -apple-system, sans-serif;
  --mono:"Chivo Mono", ui-monospace, SFMono-Regular, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;color:var(--gold);line-height:1}
.sub{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.clock{font-family:var(--display);font-size:15px;color:var(--muted)}
.clock b{color:var(--fg);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;display:inline-block;min-width:3.2ch}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{border-color:var(--gold);color:var(--gold)}
.only-narrow{display:none}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;min-height:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#map.panning{cursor:grabbing}

.inspect{position:absolute;top:10px;left:10px;width:256px;max-width:calc(100% - 20px);max-height:calc(100% - 64px);overflow:auto;background:var(--veil);border:1px solid var(--line);border-radius:5px;padding:10px 12px 12px;font-size:13px;backdrop-filter:blur(4px);box-sizing:border-box}
.inspect h4{margin:0 22px 2px 0;font-family:var(--display);font-weight:500;font-size:18px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.inspect .k{color:var(--muted);font-size:12px;margin:0 0 8px}
.inspect dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.inspect dt{color:var(--muted)}
.inspect dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.inspect .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:16px;padding:2px 6px}
.inspect h5{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.traits{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.trait{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.trait.good{color:#a6dc9f;border-color:#3d5e3a}.trait.bad{color:#f19a8b;border-color:#6b3a32}.trait.gold{color:var(--gold);border-color:#6b5428}
.loy{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:4px 0 4px}
.loy i{display:block;height:100%}
.reasons{font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:1px 8px}
.reasons b{font-family:var(--mono);font-weight:400;text-align:right}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0 6px}
.res div{background:var(--panel2);border-radius:3px;padding:4px 5px;text-align:center}
.res span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.res b{font-family:var(--mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.clist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;padding:2px 4px;border-radius:3px}
.clist li:hover{background:var(--panel2)}
.clist .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist .v{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.ibtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ibtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font-size:12px}
.ibtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid currentColor;color:var(--war);white-space:nowrap}
.chip.ally{color:var(--peace)}

.views{position:absolute;right:10px;bottom:10px;display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--veil)}
.views button{background:none;border:0;border-right:1px solid var(--line);padding:5px 9px;font-size:12px;color:var(--muted)}
.views button:last-child{border-right:0}
.views button[aria-pressed="true"]{color:var(--gold);background:var(--gold-soft)}
.laws{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,14,.6);z-index:5}
.laws .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px 16px;width:min(400px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box}
.laws h3{margin:0 0 4px;font-family:var(--display);font-weight:500;font-size:20px}
.laws p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.law{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.law input{grid-row:1/3;accent-color:var(--gold);width:16px;height:16px;margin:2px 0 0}
.law b{font-weight:600;font-size:13.5px}.law span{font-size:12px;color:var(--muted)}

.dock{border-top:1px solid var(--line);background:var(--panel);display:grid;gap:8px;padding:8px 10px 10px;min-width:0}
.dockrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tabs button{flex:none;background:none;border:1px solid transparent;border-radius:4px;padding:4px 9px;font-family:var(--display);font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--line);background:var(--panel2)}
.help{font-size:12.5px;color:var(--muted);flex:1;min-width:180px;margin:0}
.help b{color:var(--fg);font-weight:600}
.brush{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.brush input{width:110px;accent-color:var(--gold)}
.brush output{font-family:var(--mono);color:var(--fg);min-width:2ch}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tool{flex:none;width:68px;display:grid;justify-items:center;gap:4px;padding:7px 2px 6px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;font-size:11.5px;color:var(--muted)}
.tool canvas{width:32px;height:32px;image-rendering:pixelated}
.tool:hover{color:var(--fg)}
.tool[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}

.side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.side h3{margin:0 0 8px;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.04em;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border-radius:4px;padding:8px 10px}
.stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat b{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.stat.hot b{color:var(--war)}
.races{display:grid;gap:7px}
.race{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:8px;font-size:13px}
.bar{grid-column:2/4;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:-3px}
.bar i{display:block;height:100%}
.race b{font-family:var(--mono);font-weight:400;font-variant-numeric:tabular-nums}
.fauna{display:flex;flex-wrap:wrap;gap:6px}
.fauna span{font-size:12px;background:var(--panel2);border-radius:3px;padding:3px 7px;display:flex;gap:6px;align-items:center}
.fauna b{font-family:var(--mono);font-weight:400;font-variant-numeric:tabular-nums}
.kings{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kings li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:13px;cursor:pointer;padding:4px;border-radius:3px}
.kings li:hover{background:var(--panel2)}
.kings .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kings .meta{grid-column:2/4;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.kings .pop{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{font-size:12.5px;color:var(--muted);margin:0}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12.5px;line-height:1.4}
.log li{display:grid;grid-template-columns:48px 1fr;gap:6px}
.log .yr{font-family:var(--mono);color:var(--muted);font-size:11.5px;padding-top:1px}
.log .war{color:#f19a8b}.log .peace{color:#a6dc9f}.log .god{color:var(--gold)}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:20;border-radius:0;padding-top:max(14px,env(safe-area-inset-top,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(105%);transition:transform .2s ease}
  .side.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
  .only-narrow{display:inline-block}
  .sub{display:none}
  .help{order:3;flex-basis:100%}
}
@media (max-width:520px){.logo{font-size:22px}.btn{padding:6px 9px;font-size:12px}.top{gap:8px}.inspect{width:220px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">Genèse</span><span class="sub">bac à sable divin</span></div>
    <div class="clock">An <b id="year">0</b></div>

  <div class="main">
    <section class="stage">
      <div class="mapwrap" id="mapwrap">
        <canvas id="map" aria-label="Carte du monde"></canvas>

      </div>
      <div class="dock">

          <div class="tabs" role="tablist" id="tabs"></div>
          <p class="help" id="help"></p>
          <label class="brush" id="brushBox">Pinceau <input type="range" id="brush" min="1" max="10" value="3"><output id="brushOut">3</output></label>

    <aside class="side" id="side">

        <div class="stat"><span>Royaumes</span><b id="sKings">0</b></div>

      <div><h3>Faune</h3><div class="fauna" id="fauna"></div></div>
      <div><h3>Royaumes</h3><ol class="kings" id="kings"></ol></div>
      <div><h3>Chroniques</h3><ol class="log" id="log"></ol></div>
    </aside>
  </div>
</div>

function valueNoise(rnd){const n=257,g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rnd();
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,a=((xi%256)+256)%256,b=((yi%256)+256)%256,
    u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);

function rankNorm(arr,mask){const idx=[];for(let i=0;i<N;i++)if(mask[i])idx.push(i);idx.sort((a,b)=>arr[a]-arr[b]);const m=Math.max(1,idx.length-1);for(let k=0;k<idx.length;k++)arr[idx[k]]=k/m}

function genWorld(seed){
  resetState();R=mulberry(seed);
  veg.fill(0);ore.fill(0);bio.fill(0);bio0.fill(0);fire.fill(0);scorch.fill(0);lava.fill(0);owner.fill(-1);bld.fill(0);
  const n1=valueNoise(R),n2=valueNoise(R),n3=valueNoise(R),n4=valueNoise(R),n5=valueNoise(R),n6=valueNoise(R);
  const cs=[],nc=3+(R()*3|0);
  for(let k=0;k<nc;k++)cs.push({x:W*(.15+R()*.7),y:H*(.18+R()*.64),rx:28+R()*50,ry:20+R()*32});
  const raw=new Float32Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let e=-1;for(const c of cs){const dx=(x-c.x)/c.rx,dy=(y-c.y)/c.ry;e=Math.max(e,1-Math.sqrt(dx*dx+dy*dy))}
    const f=fbm(n1,x/34,y/34,5),g=fbm(n2,x/9,y/9,3);
    const edge=Math.min(1,Math.min(Math.min(x,W-1-x)/20,Math.min(y,H-1-y)/16));
    raw[y*W+x]=f*1.1+e*.75+g*.18-(1-edge)*.9;
  }
  const ord=Array.from({length:N},(_,i)=>i).sort((a,b)=>raw[a]-raw[b]);
  for(let k=0;k<N;k++)hgt[ord[k]]=k/(N-1);
  const tmp=new Float32Array(N),mst=new Float32Array(N),land=new Uint8Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,t=ttype(hgt[i]);terr[i]=t;land[i]=t>=2?1:0;
    const lat=Math.abs(y/H-.5)*2;
    tmp[i]=(1-lat)*.55+fbm(n5,x/45,y/45,3)*.9-Math.max(0,hgt[i]-.75)*1.5;
    mst[i]=fbm(n6,x/36,y/36,4);
    shade[i]=(fbm(n4,x/2.5,y/2.5,2)-.5)*2+(R()-.5)*.3}
  rankNorm(tmp,land);rankNorm(mst,land);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(!land[i])continue;
    const T=tmp[i],M=mst[i],t=terr[i];let b=BIO.GRASS;
    if(T<.15)b=BIO.TUNDRA;else if(T>.7&&M<.3)b=BIO.DESERT;else if(T>.55&&M>.75)b=BIO.JUNGLE;else if(M>.85&&t===3)b=BIO.SWAMP;else if(T>.55&&M<.45)b=BIO.SAVANNA;

    veg[i]=(t===3||t===4||(t===5&&b===BIO.TUNDRA))&&R()<Math.min(.95,TREE_D[b]*cl)?1:0}
  const hills=[];for(let i=0;i<N;i++)if(terr[i]===4||terr[i]===5)hills.push(i);
  for(let v=0;v<45&&hills.length;v++){let i=pick(hills);const g=R()<.25?2:1,len=3+R()*6;
    for(let s=0;s<len;s++){if(terr[i]>=3){ore[i]=g;veg[i]=0}const x=i%W,y=i/W|0;i=Math.max(0,Math.min(H-1,y+(R()*3|0)-1))*W+Math.max(0,Math.min(W-1,x+(R()*3|0)-1))}}
  S.landVer++;S.dirtyAll=true;ensureCont();
}
function ensureCont(){if(S.contVer===S.landVer)return;S.contVer=S.landVer;cont.fill(-1);const q=new Int32Array(N);let id=0;
  for(let s=0;s<N;s++){if(terr[s]<2||cont[s]!==-1)continue;let h=0,t=0;q[t++]=s;cont[s]=id;
    while(h<t){const i=q[h++],x=i%W;
      if(x>0&&terr[i-1]>=2&&cont[i-1]<0){cont[i-1]=id;q[t++]=i-1}
      if(x<W-1&&terr[i+1]>=2&&cont[i+1]<0){cont[i+1]=id;q[t++]=i+1}
      if(i>=W&&terr[i-W]>=2&&cont[i-W]<0){cont[i-W]=id;q[t++]=i-W}

    id++}}

function stats(u){const s=SP[u.sp],T=u.traits;let hp=s.hp,dmg=s.dmg,spd=s.spd;
  if(T.includes('fort'))dmg*=1.5;if(T.includes('robuste'))hp*=1.5;if(T.includes('rapide'))spd*=1.3;

  if(T.includes('maudit')){hp*=.6;dmg*=.7;spd*=.8}
  const lv=1+u.lvl*.12;u.maxhp=hp*lv;u.dmg=dmg*lv;u.spd=spd;
  u.immortal=T.includes('immortel');u.mad=T.includes('fou');u.beni=T.includes('beni');if(u.hp>u.maxhp)u.hp=u.maxhp}

  T.push(t);if(t==='sage')u.maxAge*=1.5;const r=u.hp/(u.maxhp||1);stats(u);u.hp=Math.max(1,u.maxhp*r);return true}

    maxAge:s.life[0]+R()*(s.life[1]-s.life[0]),traits:[],lvl:0,xp:0,kills:0,name:personName(sp),city:null,k:null,role:null,state:'wander',task:null,
    cd:0,wait:0,foe:null,sick:0,wt:0,foundAt:30+R()*60,stuck:0,target:null,dead:false,boat:null,held:false,fly:null,fed:S.tick,home:null,dir:1,

function die(u,silent){if(u.dead)return;u.dead=true;u.hp=0;S.anyDead=true;

// ---- grille spatiale
let head=new Int32Array(GW*GH),nxt=new Int32Array(4096),GU=[];const threat=new Uint8Array(GW*GH),ckid=new Int32Array(GW*GH);
function buildGrid(){GU=S.units;head.fill(-1);threat.fill(0);ckid.fill(0);if(nxt.length<GU.length)nxt=new Int32Array(GU.length*2);
  for(let j=0;j<GU.length;j++){const u=GU[j];if(u.dead||u.boat||u.held||u.fly)continue;const c=(Math.min(GH-1,Math.max(0,(u.y/CS)|0)))*GW+Math.min(GW-1,Math.max(0,(u.x/CS)|0));nxt[j]=head[c];head[c]=j;
    if(u.civ){if(u.mad)threat[c]|=1;else{const kk=u.k?u.k.id:-1;if(ckid[c]===0)ckid[c]=kk;else if(ckid[c]!==kk)threat[c]|=2}}else if(u.sp!=='sheep')threat[c]|=1}}

  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const c=cy*GW+cx;if(threat[c])return true;const o=ckid[c];
    if(o!==0&&o!==K&&(o===-1||K===-1||u.k.wars.has(o)))return true}return false}
function threatNear(x,y,rad,mask){const cx0=Math.max(0,((x-rad)/CS)|0),cx1=Math.min(GW-1,((x+rad)/CS)|0),cy0=Math.max(0,((y-rad)/CS)|0),cy1=Math.min(GH-1,((y+rad)/CS)|0);
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++)if(threat[cy*GW+cx]&mask)return true;return false}
function eachNear(x,y,rad,fn){const cx0=Math.max(0,((x-rad)/CS)|0),cx1=Math.min(GW-1,((x+rad)/CS)|0),cy0=Math.max(0,((y-rad)/CS)|0),cy1=Math.min(GH-1,((y+rad)/CS)|0),r2=rad*rad;
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){let j=head[cy*GW+cx];while(j>=0){const v=GU[j];if(!v.dead){const dx=v.x-x,dy=v.y-y;if(dx*dx+dy*dy<=r2&&fn(v)===true)return true}j=nxt[j]}}return false}

// ---- déplacement
function walk(x,y){if(!(x>=0&&y>=0&&x<W&&y<H))return false;const i=(y|0)*W+(x|0);return terr[i]>=2&&!lava[i]}
function move(u,tx,ty,mul){
  const dx=tx-u.x,dy=ty-u.y,d=Math.sqrt(dx*dx+dy*dy);if(d<.05)return true;
  const i=(u.y|0)*W+(u.x|0),bad=terr[i]<2||lava[i]>0;
  const sp=u.spd*mul*SPD[terr[i]]*BSPD[bio[i]]*(veg[i]?.85:1);
  const st=Math.min(d,sp);let nx=u.x+dx/d*st,ny=u.y+dy/d*st;
  if(!walk(nx,ny)&&!(bad&&inB(nx|0,ny|0))){const a=R()<.5?1:-1;nx=u.x-dy/d*a*st;ny=u.y+dx/d*a*st;
    if(!walk(nx,ny)){u.stuck++;return false}}
  u.dir=dx<0?-1:1;u.x=nx;u.y=ny;u.stuck=0;return d<=st}
function flyTo(u,tx,ty,mul){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d<.05)return true;const st=Math.min(d,u.spd*mul);u.x+=dx/d*st;u.y+=dy/d*st;u.dir=dx<0?-1:1;return d<=st}
function wanderMove(u,rad,cx,cy){
  if(u.wait>0){u.wait--;return}
  if(u.tx<0||u.stuck>25){u.stuck=0;u.tx=-1;for(let t=0;t<6;t++){const x=cx+(R()*2-1)*rad,y=cy+(R()*2-1)*rad;if(walk(x,y)){u.tx=x;u.ty=y;break}}if(u.tx<0)return}
  if(move(u,u.tx,u.ty,1)){u.tx=-1;u.wait=8+R()*40|0}}
function landField(c){let f=S.fields.get(c.id);
  if(f&&f.ver===S.landVer&&S.tick-f.tick<500)return f.d;
  const d=f&&f.d||new Uint16Array(N);d.fill(FAR);const q=new Int32Array(N);let h=0,t=0;const s0=c.y*W+c.x;d[s0]=0;q[t++]=s0;
  while(h<t){const i=q[h++],x=i%W,nd=d[i]+1;
    if(x>0&&terr[i-1]>=2&&d[i-1]===FAR){d[i-1]=nd;q[t++]=i-1}
    if(x<W-1&&terr[i+1]>=2&&d[i+1]===FAR){d[i+1]=nd;q[t++]=i+1}
    if(i>=W&&terr[i-W]>=2&&d[i-W]===FAR){d[i-W]=nd;q[t++]=i-W}
    if(i<N-W&&terr[i+W]>=2&&d[i+W]===FAR){d[i+W]=nd;q[t++]=i+W}}
  S.fields.set(c.id,{d,ver:S.landVer,tick:S.tick});return d}
function moveField(u,c,mul){
  const d=landField(c),xi=u.x|0,yi=u.y|0,i=yi*W+xi,cur=d[i];
  if(cur===FAR||cur<=3){u.wp=-1;return move(u,c.x+.5,c.y+.5,mul)}
  if(u.wp==null||u.wp<0||d[u.wp]>=cur||u.stuck>8){
    // choix aléatoire pondéré parmi les cases qui rapprochent du but : la troupe s'étale au lieu de marcher en file
    let tot=0;const cand=[];
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(!dx&&!dy)continue;const x=xi+dx,y=yi+dy;if(!inB(x,y))continue;const j=y*W+x;
      if(d[j]<cur&&terr[j]>=2&&!lava[j]){const g=(cur-d[j])/Math.hypot(dx,dy);const w=g*g;cand.push(j,w);tot+=w}}
    if(!tot){u.wp=-1;return move(u,c.x+.5,c.y+.5,mul)}
    let r=R()*tot,pickj=cand[0];for(let k=0;k<cand.length;k+=2){r-=cand[k+1];if(r<=0){pickj=cand[k];break}}
    u.wp=pickj;u.stuck=0}
  if(u.ox==null){u.ox=(R()-.5)*.8;u.oy=(R()-.5)*.8}
  let tx=u.wp%W+.5+u.ox,ty=(u.wp/W|0)+.5+u.oy;if(!walk(tx,ty)){tx=u.wp%W+.5;ty=(u.wp/W|0)+.5}
  if(move(u,tx,ty,mul))u.wp=-1;return false}
function waterField(dest){const d=new Uint16Array(N).fill(FAR),q=new Int32Array(N);let h=0,t=0;const x0=dest%W,y0=dest/W|0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=x0+dx,y=y0+dy;if(!inB(x,y))continue;const j=y*W+x;if(terr[j]<2&&d[j]===FAR){d[j]=0;q[t++]=j}}
  while(h<t){const i=q[h++],x=i%W,nd=d[i]+1;
    if(x>0&&terr[i-1]<2&&d[i-1]===FAR){d[i-1]=nd;q[t++]=i-1}
    if(x<W-1&&terr[i+1]<2&&d[i+1]===FAR){d[i+1]=nd;q[t++]=i+1}
    if(i>=W&&terr[i-W]<2&&d[i-W]===FAR){d[i-W]=nd;q[t++]=i-W}
    if(i<N-W&&terr[i+W]<2&&d[i+W]===FAR){d[i+W]=nd;q[t++]=i+W}}

function canFound(x,y){

  let land=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const xx=x+dx,yy=y+dy;if(inB(xx,yy)&&terr[yy*W+xx]>=2)land++}
  return land>=22}

    if(terr[i-1]<2||terr[i+1]<2||terr[i-W]<2||terr[i+W]<2){const d=(x-x0)**2+(y-y0)**2;if(d<bd){bd=d;best=i}}}return best}
function join(u,c){u.city=c;u.k=c.k;u.state='live';u.tx=-1;u.target=null;u.home=null;u.task=null}
function leave(u){if(u.role==='king'&&u.k&&u.k.king===u){u.k.king=null;S.succ.push(u.k)}

function claim(c,r){const r2=r*r;for(let y=Math.max(0,Math.floor(c.y-r));y<=Math.min(H-1,Math.ceil(c.y+r));y++)for(let x=Math.max(0,Math.floor(c.x-r));x<=Math.min(W-1,Math.ceil(c.x+r));x++){const i=y*W+x;if((x-c.x)**2+(y-c.y)**2<=r2&&owner[i]===-1&&terr[i]>=2)owner[i]=c.id}}
function foundCity(u,k){

    tiles:0,coast:-1,settler:null,boat:null,leader:null,founded:S.tick,empty:0,dead:false,members:[],_pop:0,_war:0,starving:false,lvl:0,capturedAt:-1,loyal:100,loyR:[],low:0,wasCite:0};
  if(isNew)k=newKingdom(u.sp,c.name);

  S.cities.push(c);S.cityById.set(c.id,c);

    log(`${cap(kn(k))} ${fem(k)?'est fondée':'est fondé'} par ${u.name}.`,'found',k.color);
    for(const v of S.units)if(!v.dead&&v.state==='wander'&&v.sp===u.sp&&(v.x-u.x)**2+(v.y-u.y)**2<144)join(v,c)}
  else log(`Des colons fondent ${c.name} pour ${kn(k)}.`,'',k.color);

function destroyCity(c,why){
  if(c.dead)return;c.dead=true;
  for(let i=0;i<N;i++)if(owner[i]===c.id){owner[i]=-1;const b=bld[i];if(b===B.FIELD||b===B.SITE)bld[i]=0;else if(b&&b!==B.RUIN)bld[i]=B.RUIN}
  for(const [i,st] of S.sites)if(st.cid===c.id)S.sites.delete(i);
  S.cities.splice(S.cities.indexOf(c),1);S.cityById.delete(c.id);S.fields.delete(c.id);
  for(const u of S.units)if(u.city===c&&!u.dead)leave(u);
  const msg={empty:"est abandonnée, il n'en reste que des ruines.",lava:'est engloutie par la lave.',water:'est engloutie par les flots.'}[why]||'est rayée de la carte.';
  log(`${c.name} ${msg}`,'war');
  const k=c.k;if(k.capital===c)k.capital=S.cities.find(o=>o.k===k)||null;

function fallKingdom(k,by){
  if(k.dead)return;k.dead=true;S.kingdoms.splice(S.kingdoms.indexOf(k),1);
  for(const o of S.kingdoms){o.wars.delete(k.id);o.allies.delete(k.id)}
  for(const u of S.units)if(u.k===k){u.k=null;if(u.role)u.role=null}
  log(by?`${cap(kn(k))} s'effondre sous les coups ${kDu(by)}.`:`${cap(kn(k))} disparaît de l'histoire.`,'war',k.color)}
function capture(c,k){
  const old=c.k;if(old===k)return;c.k=k;c.capturedAt=S.tick;c.low=0;
  for(const u of S.units)if(u.city===c&&!u.dead){
    if(u.role==='king'&&old.king===u){log(`${u.name}, souverain ${kDu(old)}, est exécuté.`,'war',k.color);die(u,true);continue}
    u.k=k;if(u.state==='war'){u.state='live';u.target=null}}
  old.rel[k.id]=(old.rel[k.id]||0)-20;
  let res=0;for(const u of S.units)if(u.city===c&&!u.dead)res++;
  if(!res)c.race=k.race;
  let n=0;for(const u of S.units)if(!u.dead&&u.k===k&&u.state==='war'&&u.target===c&&u.sp===c.race&&(u.x-c.x)**2+(u.y-c.y)**2<50&&(n<3||R()<.4)){join(u,c);n++}
  if(old.capital===c)old.capital=S.cities.find(o=>o.k===old)||null;
  log(`${c.name} tombe aux mains ${kDu(k)}.`,'war',k.color);
  if(!S.cities.some(o=>o.k===old))fallKingdom(old,k)}
function crown(k,succ){
  const cs=S.cities.filter(c=>c.k===k);const pref=k.capital&&!k.capital.dead&&k.capital.k===k?k.capital:cs[0];
  let best=null,bs=-1;
  for(const u of S.units)if(!u.dead&&u.k===k&&u.city&&u.age>=18&&!u.mad&&!u.boat){const s=u.age*.3+u.lvl*4+(u.traits.includes('charismatique')?8:0)+(u.city===pref?30:0);if(s>bs){bs=s;best=u}}
  if(!best){k.king=null;return}
  if(best.role==='leader'&&best.city&&best.city.leader===best)best.city.leader=null;
  best.role='king';k.king=best;if(best.state!=='live'){best.state='live';best.target=null}freeTask(best);
  if(succ){k.succAt=S.tick;log(`${best.name} monte sur le trône ${kDu(k)}.`,'',k.color)}}
function revolt(c){
  const old=c.k,nk=newKingdom(c.race,c.name);
  const moved=[c];for(const o of S.cities)if(o!==c&&o.k===old&&o!==old.capital&&o.race===c.race&&o.loyal<5&&Math.hypot(o.x-c.x,o.y-c.y)<45)moved.push(o);
  for(const o of moved){o.k=nk;o.low=0;o.capturedAt=-1;for(const u of S.units)if(u.city===o&&!u.dead){u.k=nk;if(u.state==='war'){u.state='live';u.target=null}}}
  nk.capital=c;nk.ncities=moved.length;old.ncities-=moved.length;
  const ld=c.leader&&!c.leader.dead?c.leader:null;if(ld){ld.role='king';nk.king=ld;c.leader=null}else crown(nk,false);
  const extra=moved.length-1;
  log(`${c.name} se soulève contre ${kn(old)}${extra?` avec ${extra} autre${extra>1?'s':''} ville${extra>1?'s':''}`:''} et fonde ${kn(nk)}.`,'war',nk.color);
  nk.wars.add(old.id);old.wars.add(nk.id);nk.warY[old.id]=0;old.warY[nk.id]=0;S.revolts++}
function declareWar(a,b,god){
  if(a.allies.has(b.id)){a.allies.delete(b.id);b.allies.delete(a.id)}
  a.wars.add(b.id);b.wars.add(a.id);a.warY[b.id]=0;b.warY[a.id]=0;
  log(`${god?'Par volonté divine, ':''}${god?kn(a):cap(kn(a))} déclare la guerre ${kAu(b)}.`,'war',a.color);
  for(const id of b.allies){const al=S.kingdoms.find(q=>q.id===id);
    if(al&&al!==a&&!al.wars.has(a.id)&&!al.allies.has(a.id)){al.wars.add(a.id);a.wars.add(al.id);al.warY[a.id]=0;a.warY[al.id]=0;log(`${cap(kn(al))} entre en guerre aux côtés ${kDu(b)}.`,'war',al.color)}}}
function makePeace(a,b,god){a.wars.delete(b.id);b.wars.delete(a.id);const y=year()+15;a.truce[b.id]=y;b.truce[a.id]=y;
  log(`${god?'Les dieux imposent la paix entre ':'Paix signée entre '}${kn(a)} et ${kn(b)}.`,'peace')}

function hostile(a,b){
  if(a===b)return false;
  const za=a.sp==='zombie',zb=b.sp==='zombie';if(za||zb)return za!==zb;
  if(a.mad||b.mad)return true;
  if(a.civ&&b.civ){const ka=a.k&&!a.k.dead?a.k:null,kb=b.k&&!b.k.dead?b.k:null;
    if(ka&&kb)return ka!==kb&&ka.wars.has(kb.id);
    if(a.sp===b.sp)return false;return a.sp==='orc'||b.sp==='orc'}
  if(a.sp==='dragon'||b.sp==='dragon')return a.sp!==b.sp;
  if(a.sp==='sheep')return b.sp==='wolf';
  if(b.sp==='sheep')return a.sp==='wolf';
  return a.civ!==b.civ}
function engage(u){const f=u.foe;
  if(f.dead||f.held||f.boat||!hostile(u,f)){u.foe=null;return false}
  const fx=f.x-u.x,fy=f.y-u.y,d=Math.sqrt(fx*fx+fy*fy);if(d>10){u.foe=null;return false}
  const reach=(u.sp==='dragon'||f.sp==='dragon')?1.7:.9;
  if(d<reach){if(u.cd===0)hit(u,f)}else if(SP[u.sp].fly)flyTo(u,f.x,f.y,1);else move(u,f.x,f.y,1.1);
  return true}

// ---- métiers
function pickTile(c,cond,extra){const r=c.r+extra,hc=cont[c.y*W+c.x];
  for(let t=0;t<50;t++){const x=Math.round(c.x+(R()*2-1)*r),y=Math.round(c.y+(R()*2-1)*r);if(!inB(x,y))continue;const i=y*W+x;
    if((owner[i]===c.id||(extra&&owner[i]===-1))&&cont[i]===hc&&cond(i))return i}return -1}
function freeTask(u){const tk=u.task;if(tk&&tk.type==='build'){const st=S.sites.get(tk.i);if(st&&st.bu===u)st.bu=null}u.task=null}
const TDUR={farm:30,gather:30,chop:35,mine:40,fish:35,build:45};
function assignTask(u,c){
  for(const [i,st] of S.sites)if(st.cid===c.id&&!st.bu){st.bu=u;return{type:'build',i,w:0,dur:TDUR.build,arr:false}}
  const need=c.food<c.pop*2.5,opts=[];
  if(c.race==='elf')opts.push(['gather',need?4:1.4]);else if(c.fields)opts.push(['farm',need?4:1.4]);
  if(c.docks>=0)opts.push(['fish',need?2.2:.6]);
  opts.push(['chop',c.wood<16?(c.race==='elf'?1.2:2):.25]);
  opts.push(['mine',c.stone<16?(c.race==='dwarf'?2.5:.9):.3]);
  let tot=0;for(const o of opts)tot+=o[1];let r=R()*tot,type=opts[0][0];for(const o of opts){r-=o[1];if(r<=0){type=o[0];break}}
  let i=-1;
  switch(type){
    case'farm':i=pickTile(c,j=>bld[j]===B.FIELD,0);break;
    case'gather':case'chop':i=pickTile(c,j=>veg[j]&&!bld[j],4);break;
    case'mine':i=pickTile(c,j=>bld[j]===B.MINE,0);if(i<0)i=pickTile(c,j=>(terr[j]===4||terr[j]===5)&&!bld[j]&&!veg[j],3);break;
    case'fish':i=c.docks;break}
  if(i<0)return null;
  return{type,i,w:0,dur:TDUR[type],arr:false}}
function validTask(tk,c){const i=tk.i;switch(tk.type){
  case'build':{const st=S.sites.get(i);return!!st&&st.cid===c.id&&bld[i]===B.SITE}
  case'farm':return bld[i]===B.FIELD&&owner[i]===c.id;
  case'gather':case'chop':return!!veg[i];
  case'mine':return terr[i]===4||terr[i]===5||bld[i]===B.MINE;
  case'fish':return bld[i]===B.DOCKS}return false}
function doTask(u){const tk=u.task,c=u.city,i=tk.i;
  if(!validTask(tk,c)){freeTask(u);return}
  if(!tk.arr){const tx=i%W+.5,ty=(i/W|0)+.5;if((tx-u.x)**2+(ty-u.y)**2<.5||move(u,tx,ty,1))tk.arr=true;else if(u.stuck>40){freeTask(u);u.stuck=0}return}
  if(++tk.w>=tk.dur){finishTask(u,tk,c);u.task=null;u.wait=10+R()*30|0}}
function finishTask(u,tk,c){const i=tk.i;switch(tk.type){
  case'farm':c.food+=3*(c.mills?1.35:1);break;
  case'gather':c.food+=2.6;break;case'fish':c.food+=2.4;break;
  case'chop':if(veg[i]){veg[i]=0;mark(i)}c.wood+=2;break;
  case'mine':c.stone+=1;if(ore[i]===1){c.stone+=1;c.k.tp+=1}else if(ore[i]===2){c.gold+=1;c.k.tp+=.5}if(ore[i]&&R()<.03){ore[i]=0;mark(i)}break;
  case'build':{const st=S.sites.get(i);if(st&&bld[i]===B.SITE){bld[i]=st.type;S.sites.delete(i);mark(i)}break}}}

// ---- comportements
function civStep(u){
  const adult=u.age>=14;
  if(u.city&&u.city.dead)leave(u);
  if(u.mad){if((S.tick+u.id)%4===0&&(!u.foe||u.foe.dead))u.foe=findFoe(u,6);if(u.foe&&engage(u))return;wanderMove(u,10,u.x,u.y);return}
  if(adult&&u.role!=='king'&&(S.tick+u.id)%4===0){const cr=u.state==='war'?7:u.state==='live'?4.5:u.sp==='orc'?5:3.5;
    if(!u.foe||u.foe.dead||(u.foe.x-u.x)**2+(u.foe.y-u.y)**2>cr*cr*1.6){u.foe=civThreat(u,u.x,u.y,cr)?findFoe(u,cr):null}}
  if(u.foe){if(u.task)freeTask(u);if(engage(u))return}
  switch(u.state){
    case'wander':{
      u.wt++;
      if(adult&&u.wt>u.foundAt&&(S.tick+u.id)%5===0&&!u.home){
        const xi=u.x|0,yi=u.y|0,hc=cont[yi*W+xi],o=owner[yi*W+xi];
        if(o>=0){const c=S.cityById.get(o);if(c&&c.race===u.sp){join(u,c);return}}
        let home=null,hd=45*45;for(const c of S.cities)if(c.race===u.sp&&cont[c.y*W+c.x]===hc){const d=(c.x-xi)**2+(c.y-yi)**2;if(d<hd){hd=d;home=c}}
        if(home)u.home=home;else if(canFound(xi,yi)){foundCity(u,null);return}else u.wt=u.foundAt-25}
      if(u.home){const h=u.home;if(h.dead){u.home=null}else{if(move(u,h.x+.5,h.y+.5,1)||(h.x-u.x)**2+(h.y-u.y)**2<9)join(u,h);else if(u.stuck>60){u.home=null;u.stuck=0}return}}
      wanderMove(u,8,u.x,u.y);break}
    case'live':{const c=u.city;if(!c){u.state='wander';break}
      if((S.tick+u.id)%50===0&&cont[(u.y|0)*W+(u.x|0)]!==cont[c.y*W+c.x]){leave(u);break}
      if(u.task){doTask(u);break}
      wanderMove(u,Math.max(2,c.r*.7),c.x+.5,c.y+.5);break}
    case'settler':{
      if(move(u,u.tx,u.ty,1)||u.stuck>150){const x=u.x|0,y=u.y|0;
        if(canFound(x,y))foundCity(u,u.k&&!u.k.dead?u.k:null);
        else{const s=findSpot(x,y,cont[y*W+x],6);if(s&&u.stuck<=150){u.tx=s.x+.5;u.ty=s.y+.5;u.stuck=0}
          else{u.stuck=0;if(u.city&&cont[y*W+x]===cont[u.city.y*W+u.city.x])u.state='live';else leave(u)}}}
      break}
    case'follow':{const L=u.target;
      if(!L||L.dead){u.target=null;if(u.city)u.state='live';else leave(u);break}
      if(L.state!=='settler'&&L.state!=='boat'){if(L.city&&!L.city.dead&&L.city.race===u.sp)join(u,L.city);else{u.target=null;if(u.city)u.state='live';else leave(u)}break}
      if((L.x-u.x)**2+(L.y-u.y)**2>1.2)move(u,L.x,L.y,1.15);break}
    case'war':{const tc=u.target;
      if(!tc||tc.dead||!u.k||u.k.dead||tc.k===u.k||!u.k.wars.has(tc.k.id)||u.stuck>200){u.state=u.city?'live':'wander';u.target=null;u.stuck=0;u.tx=-1;break}
      moveField(u,tc,1.05);
      if((tc.x+.5-u.x)**2+(tc.y+.5-u.y)**2<2.5){
        const def=eachNear(tc.x+.5,tc.y+.5,4.5,v=>v.k===tc.k&&v.age>=14&&!v.mad);
        if(!def)capture(tc,u.k)}
      break}
  }}
function creatureStep(u){
  const sp=u.sp;
  if(sp==='dragon'){dragonStep(u);return}
  if((S.tick+u.id)%5===0){
    if(sp==='sheep'){u.flee=findFoe(u,4,v=>hostile(v,u))}
    else if(sp==='wolf'){if(!u.foe||u.foe.dead){const hungry=S.tick-u.fed>400;u.foe=(hungry?findFoe(u,9,v=>v.sp==='sheep'):null)||findFoe(u,2.5,v=>v.sp!=='sheep'&&hostile(u,v))}}
    else if(sp==='bear'){if(!u.foe||u.foe.dead)u.foe=findFoe(u,3)}
    else if(sp==='zombie'){if(!u.foe||u.foe.dead)u.foe=findFoe(u,6)}}
  if(u.flee){const f=u.flee;if(f.dead)u.flee=null;else{const dx=u.x-f.x,dy=u.y-f.y,d=Math.hypot(dx,dy)||1;move(u,u.x+dx/d*2,u.y+dy/d*2,1.5);return}}
  if(u.foe&&engage(u))return;
  if(sp==='zombie'&&u.tx<0&&R()<.01&&S.cities.length){const hc=cont[(u.y|0)*W+(u.x|0)];let best=null,bd=60*60;
    for(const c of S.cities)if(cont[c.y*W+c.x]===hc){const d=(c.x-u.x)**2+(c.y-u.y)**2;if(d<bd){bd=d;best=c}}
    if(best){u.tx=best.x+.5;u.ty=best.y+.5;u.wait=0}}
  wanderMove(u,sp==='sheep'?5:sp==='zombie'?12:10,u.x,u.y)}
function dragonStep(u){
  if(!u.goal||R()<.002){if(S.cities.length&&R()<.55){const c=pick(S.cities);u.goal={x:c.x+.5,y:c.y+.5}}else u.goal={x:8+R()*(W-16),y:8+R()*(H-16)}}
  if((S.tick+u.id)%6===0&&(!u.foe||u.foe.dead||(u.foe.x-u.x)**2+(u.foe.y-u.y)**2>80))u.foe=findFoe(u,6,v=>v.sp!=='dragon'&&!v.held);
  const f=u.foe&&!u.foe.dead&&!u.foe.boat?u.foe:null;
  const gx=f?f.x:u.goal.x,gy=f?f.y:u.goal.y,d=Math.hypot(gx-u.x,gy-u.y);
  if(d>1.4)flyTo(u,gx,gy,1);else if(!f)u.goal=null;
  if(f&&d<1.8&&u.cd===0)hit(u,f);
  if(u.cd===0&&(f||d<6)&&R()<.05){breath(u.x+u.dir*1.6,u.y+.4,u);u.cd=20}
  u.x=Math.max(1,Math.min(W-1.01,u.x));u.y=Math.max(1,Math.min(H-1.01,u.y))}
function breath(x,y,src){brush(x,y,1.8,i=>{if(R()<.6)ignite(i,25)});
  for(const v of unitsIn(x,y,1.8))if(v!==src&&v.sp!=='dragon'){v.hp-=14;if(v.hp<=0)kill(v,src)}
  S.fx.push({type:'breath',x,y,sx:src.x,sy:src.y,t:0,life:12})}
function stepUnit(u){const s=SP[u.sp];
  if(!u.civ||S.laws.aging)u.age+=1/YEAR;
  if(u.age>u.maxAge&&!u.immortal){die(u);return}
  if(u.held||u.boat)return;
  if(u.fly){const f=u.fly;u.x=Math.max(0,Math.min(W-.01,u.x+f.vx));u.y=Math.max(0,Math.min(H-.01,u.y+f.vy));f.vx*=.9;f.vy*=.9;
    if(--f.t<=0){u.fly=null;if(!s.fly&&f.sp>.3){u.hp-=(f.sp-.2)*70;if(u.hp<=0)die(u)}}return}
  const ti=(u.y|0)*W+(u.x|0);
  if(!s.fly){if(terr[ti]<2)u.hp-=u.sp==='zombie'?.25:.8;if(fire[ti])u.hp-=1.5;if(lava[ti])u.hp-=8}
  if(u.sick){u.hp-=.035;if(R()<.0025)u.sick=0;else if(R()<.06)eachNear(u.x,u.y,1.6,v=>{if(v!==u&&!v.sick&&v.sp!=='zombie'&&v.sp!=='dragon'&&R()<.5){v.sick=1;return true}})}
  if(u.city&&u.city.starving)u.hp-=.03;
  if(u.hp<=0){die(u);return}
  if(u.cd>0)u.cd--;
  if(!u.foe&&u.hp<u.maxhp)u.hp+=u.beni?.04:.012;
  if(u.civ)civStep(u);else creatureStep(u)}

// ---- construction et gestion des villes
function cityCap(c){return 5+c.houses*4}
function buildable(c,i){const t=terr[i];return(t>=2&&t<=4||(t===5&&c.race==='dwarf'))&&(bld[i]===0||bld[i]===B.RUIN)&&!fire[i]&&!lava[i]}
function fieldable(c,i){return(terr[i]===3||(terr[i]===4&&c.race==='dwarf'))&&!veg[i]&&!bld[i]&&!fire[i]&&!lava[i]&&!ore[i]}
function buildSpot(c,cond){const r=Math.max(2,c.r*.75);

function spawnHerd(sp,n,cond){for(let t=0;t<200;t++){const i=R()*N|0;if(!cond(i))continue;const x=i%W+.5,y=(i/W|0)+.5;

function nearName(x,y){let best=null,bd=25*25;for(const c of S.cities){const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;best=c}}return best?' près '+de(best.name):''}
function naturalDisaster(){let i=-1;for(let t=0;t<200;t++){const j=R()*N|0;if(terr[j]>=3){i=j;break}}if(i<0)return;
  const x=i%W+.5,y=(i/W|0)+.5,r=R(),nm=nearName(x,y);
  if(r<.38){POWERS.tornado(x,y);log(`Une tornade se forme${nm}.`,'god')}
  else if(r<.62){POWERS.quake(x,y);log(`Un séisme secoue la terre${nm}.`,'god')}
  else if(r<.76)POWERS.meteor(x,y);
  else if(r<.86){POWERS.volcano(x,y);log(`Un volcan s'éveille${nm}.`,'god')}
  else if(S.cities.length){const c=pick(S.cities);let n=0;for(const m of c.members)if(R()<.3){m.sick=1;n++}if(n)log(`La peste se déclare à ${c.name}.`,'war')}}
function yearly(){
  const byK=new Map();for(const c of S.cities){if(!byK.has(c.k))byK.set(c.k,[]);byK.get(c.k).push(c)}
  for(const k of S.kingdoms){const cs=byK.get(k)||[];k.ncities=cs.length;k.pop=cs.reduce((a,c)=>a+c.pop,0);
    k.tp+=cs.length*.3;while(k.tier<3&&k.tp>=TIER_T[k.tier+1]){k.tier++;log(`${cap(kn(k))} entre dans ${TIERS[k.tier]}.`,'',k.color)}
    k.conts=new Set(cs.map(c=>cont[c.y*W+c.x]));k.docks=cs.some(c=>c.docks>=0);
    if(!k.capital||k.capital.dead||k.capital.k!==k)k.capital=cs.slice().sort((a,b)=>b.pop-a.pop)[0]||null;
    if((!k.king||k.king.dead||k.king.k!==k)&&cs.length)crown(k,!!k.king);

    k.peaceY=k.wars.size?0:(k.peaceY||0)+1}

  if(S.laws.revolts)for(const c of S.cities.slice()){if(c.dead)continue;if(c.low>=10&&c.pop>=10&&c.k.ncities>=2&&c.k.capital!==c&&R()<.12){revolt(c);break}}

function nature(){

  for(let t=0;t<400;t++){const i=R()*N|0,tt=terr[i],b=bio[i];

    if(tt<3||tt>5||(tt===5&&b!==BIO.TUNDRA)||bld[i]||fire[i]||lava[i])continue;

    if(veg[i]){if(R()<(1-d)*.25){veg[i]=0;mark(i)}continue}
    if(!d)continue;
    const x=i%W,nb=(x>0&&veg[i-1])||(x<W-1&&veg[i+1])||(i>=W&&veg[i-W])||(i<N-W&&veg[i+W]);
    if(R()<d*(nb?.6:.03)*(owner[i]>=0?.35:1)){veg[i]=1;mark(i)}}}

function seedPeoples(){const spots=[];
  for(const race of CIV)for(let n=0;n<2;n++){
    let best=null;

function paintBiome(x,y,r,b){brush(x,y,r,i=>{if(terr[i]<2)return;bio[i]=b;bio0[i]=b;if(!bld[i]&&terr[i]>=3&&terr[i]<=4&&R()<.35)veg[i]=R()<TREE_D[b]*1.4?1:0;mark(i)})}

};
function spawnAt(sp,x,y,r){

  for(const o of S.cities)if(o.k!==k&&!k.wars.has(o.k.id)){const d=(o.x-c.x)**2+(o.y-c.y)**2;if(d<bd){bd=d;best=o.k}}

<script>

const base=new Uint8ClampedArray(N*3),kcol=new Int32Array(32768),rcol=new Int32Array(32768),kid=new Int32Array(32768),lcol=new Int32Array(32768);

const C={deep0:rgb('#112a4d'),deep1:rgb('#1b4274'),sh0:rgb('#22528a'),sh1:rgb('#3b7fbd'),sand:rgb('#dcc78a'),mt0:rgb('#7c736a'),mt1:rgb('#a29a92'),snow:rgb('#eef1f2')};

const BC=[['#71ad4c','#56913c','#86995a','#8f8460','#2f6d34','#27602d'],['#e2c27a','#d2ab5e','#c9a865','#b8955a','#6f9a45','#5f8f3e'],

  ['#5f7d45','#4f6b3c','#6a7550','#5f6a48','#3d5a34','#344d2d'],['#bdb752','#a8a343','#a59a5c','#978c50','#6e7d34','#5f6d2c'],

  const wasFit=cam.z<=minZ*1.001;minZ=Math.min(cw/W,ch/H);if(wasFit||cam.z<minZ)cam.z=minZ;clampCam()}
function clampCam(){const vw=cw/cam.z,vh=ch/cam.z;cam.x=vw>=W?(W-vw)/2:Math.max(0,Math.min(W-vw,cam.x));cam.y=vh>=H?(H-vh)/2:Math.max(0,Math.min(H-vh,cam.y))}
function zoomAt(sx,sy,nz){nz=Math.max(minZ,Math.min(30,nz));const wx=cam.x+sx/cam.z,wy=cam.y+sy/cam.z;cam.z=nz;cam.x=wx-sx/nz;cam.y=wy-sy/nz;clampCam()}
function centerOn(x,y,z){if(z)cam.z=Math.max(minZ,Math.min(30,z));cam.x=x-cw/2/cam.z;cam.y=y-ch/2/cam.z;clampCam()}

      case'meteor':{const fall=12;
        if(f.t<fall){const q=f.t/fall,hx=sx-(1-q)*cw*.4,hy=sy-(1-q)*ch*.7;ctx.strokeStyle='rgba(255,170,60,.8)';ctx.lineWidth=Math.max(3,z*.5);ctx.beginPath();ctx.moveTo(hx-60*(1-q*.5),hy-100*(1-q*.5));ctx.lineTo(hx,hy);ctx.stroke();ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(hx,hy,Math.max(4,z*.8),0,Math.PI*2);ctx.fill()}
        else{const q=(f.t-fall)/(f.life-fall);if(f.t===fall)shake=16;ctx.fillStyle=`rgba(255,${150+q*80|0},60,${.55*(1-q)})`;ctx.beginPath();ctx.arc(sx,sy,(2+q*7)*z,0,Math.PI*2);ctx.fill()}break}
      case'boom':{const q=f.t/f.life;ctx.fillStyle=`rgba(255,${180-q*80|0},70,${.7*(1-q)})`;ctx.beginPath();ctx.arc(sx,sy,(1+q*f.r)*z,0,Math.PI*2);ctx.fill();break}
      case'nuke':{const q=f.t/f.life;if(f.t<6){ctx.fillStyle=`rgba(255,255,240,${.85-f.t*.12})`;ctx.fillRect(-20,-20,cw+40,ch+40)}
        ctx.strokeStyle=`rgba(255,230,180,${.8*(1-q)})`;ctx.lineWidth=Math.max(2,z*.4);ctx.beginPath();ctx.arc(sx,sy,q*24*z,0,Math.PI*2);ctx.stroke();
        const rise=Math.min(1,q*2.5),cy=sy-rise*7*z;ctx.fillStyle=`rgba(120,90,70,${.75*(1-q)})`;rect(sx-z*.8,cy,z*1.6,sy-cy);
        ctx.fillStyle=`rgba(255,${170-q*100|0},80,${.85*(1-q)})`;ctx.beginPath();ctx.ellipse(sx,cy,(2+rise*4)*z,(1.2+rise*2)*z,0,0,Math.PI*2);ctx.fill();break}
      case'rain':{ctx.strokeStyle=`rgba(170,205,240,${.7*a})`;ctx.lineWidth=1.2;ctx.beginPath();for(let j=0;j<26;j++){const ang=Math.random()*Math.PI*2,d=Math.sqrt(Math.random())*f.r*z,x=sx+Math.cos(ang)*d,y=sy+Math.sin(ang)*d;ctx.moveTo(x,y);ctx.lineTo(x-2,y+Math.max(4,z*.6))}ctx.stroke();break}
      case'plague':{ctx.strokeStyle=`rgba(160,215,90,${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,f.r*z*(.6+.4*f.t/f.life),0,Math.PI*2);ctx.stroke();break}
      case'light':{ctx.fillStyle=`rgba(255,236,170,${.35*a})`;rect(sx-f.r*z*.5,-20,f.r*z,sy+20);ctx.strokeStyle=`rgba(255,226,140,${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,f.r*z,0,Math.PI*2);ctx.stroke();break}
      case'spark':{ctx.strokeStyle=`rgba(242,184,75,${a})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx,sy-z*.3,(.3+f.t/f.life)*Math.max(6,z),0,Math.PI*2);ctx.stroke();break}
      case'breath':{const bx=(f.sx-cam.x)*z,by=(f.sy-cam.y)*z-z*1.4;ctx.strokeStyle=`rgba(255,${140+f.t*8},40,${a})`;ctx.lineWidth=Math.max(2,z*.6*a);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(sx,sy);ctx.stroke();break}
      case'smoke':{const q=f.t/f.life;ctx.fillStyle=`rgba(110,110,115,${.45*(1-q)})`;ctx.beginPath();ctx.arc(sx+q*2*z,sy-q*6*z,(.6+q*2)*z,0,Math.PI*2);ctx.fill();break}
      case'steam':{const q=f.t/f.life;ctx.fillStyle=`rgba(230,235,240,${.5*(1-q)})`;ctx.beginPath();ctx.arc(sx,sy-q*3*z,(.4+q)*z,0,Math.PI*2);ctx.fill();break}}
    f.t++}
  S.fx=S.fx.filter(f=>f.t<f.life);
  // curseur
  if(hover&&(!drag||drag.mode==='paint')&&tool!=='pan'){const T=TOOL[tool];ctx.strokeStyle='rgba(242,184,75,.85)';ctx.lineWidth=1.5;
    const r=T.brush?(T.spawn?Math.max(.6,brushR*.6):brushR)*z:{meteor:6,nuke:9,tnt:2.6,bolt:1.8,quake:14,acid:7,volcano:5,tornado:2.4,hand:2.2}[tool]*z||6;
    ctx.beginPath();ctx.arc(hover.x,hover.y,Math.max(4,r),0,Math.PI*2);ctx.stroke()}
  ctx.setTransform(1,0,0,1,0,0)}

// ---- panneau
const $=id=>document.getElementById(id);
const iconURL={};for(const k of Object.keys(ICONS))iconURL[k]=iconCanvas(k).toDataURL();
const ico=k=>`<img src="${iconURL[k]}" alt="" width="16" height="16" style="image-rendering:pixelated;flex:none">`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lastLog=null,lastLogN=-1;
function updateSide(force){
  $('year').textContent=year();
  const cnt=S.cnt||{};
  $('sPop').textContent=S.nCiv;$('sCities').textContent=S.cities.length;$('sKings').textContent=S.kingdoms.length;
  let wars=0;for(const k of S.kingdoms)wars+=k.wars.size;wars/=2;$('sWars').textContent=wars;$('warBox').classList.toggle('hot',wars>0);
  const max=Math.max(1,...CIV.map(r=>cnt[r]||0));
  $('races').innerHTML=CIV.map(r=>`<div class="race">${ico(r)}<span>${SP[r].name}</span><b>${cnt[r]||0}</b><div class="bar"><i style="width:${(cnt[r]||0)/max*100}%;background:${SP[r].body}"></i></div></div>`).join('');
  $('fauna').innerHTML=ANIMALS.map(a=>`<span>${ico(a)}${SP[a].name}<b>${cnt[a]||0}</b></span>`).join('');
  const ks=[...S.kingdoms].sort((a,b)=>b.pop-a.pop||b.ncities-a.ncities).slice(0,12);
  $('kings').innerHTML=ks.length?ks.map(k=>`<li data-k="${k.id}"><i class="sw" style="background:${k.color}"></i><span class="nm">${esc(k.name)}</span><span class="pop">${k.pop}</span><span class="meta">${SP[k.race].name} · ${k.ncities} ville${k.ncities>1?'s':''} · ${TIERN[k.tier]}${k.wars.size?`<span class="chip">guerre${k.wars.size>1?' ×'+k.wars.size:''}</span>`:''}${k.allies.size?`<span class="chip ally">allié${k.allies.size>1?'s':''}</span>`:''}</span></li>`).join(''):'<p class="empty">Aucun royaume. Choisis un peuple dans le dock et clique sur une terre.</p>';
  const lg=S.log[S.log.length-1]||null;
  if(force||lg!==lastLog||S.log.length!==lastLogN){lastLog=lg;lastLogN=S.log.length;
    $('log').innerHTML=S.log.slice(-45).reverse().map(e=>`<li><span class="yr">An ${e.y}</span><span class="${e.kind}">${e.color?`<i class="sw" style="background:${e.color};margin-right:6px;vertical-align:-1px"></i>`:''}${esc(e.text)}</span></li>`).join('')}
  updateInspect()}
$('kings').addEventListener('click',e=>{const li=e.target.closest('li[data-k]');if(!li)return;const k=S.kingdoms.find(q=>q.id===+li.dataset.k);if(!k)return;
  sel={kind:'kingdom',k};follow=null;const c=k.capital&&!k.capital.dead?k.capital:S.cities.find(q=>q.k===k);if(c)centerOn(c.x+.5,c.y+.5,Math.max(cam.z,6));updateInspect();side.classList.remove('open')});
const TNAMES=['Océan profond','Mer','Plage','Plaine','Colline','Montagne','Sommet enneigé'];
const LVL=['Village','Bourg','Cité'];
const TASKN={farm:'Cultive les champs',gather:'Cueille en forêt',chop:'Coupe du bois',mine:'Travaille à la mine',fish:'Pêche au port',build:'Construit'};
function activity(u){if(!SP[u.sp].civ)return u.foe?'Chasse':'Sauvage';if(u.mad)return'Pris de folie';if(u.boat)return'En mer';if(u.foe)return'Se bat';
  if(u.state==='live')return u.task?TASKN[u.task.type]:u.role==='king'?'Gouverne':'Flâne en ville';
  return{wander:'Vagabond',settler:'Colon en route',follow:'Accompagne des colons',war:'En campagne'}[u.state]||''}
const traitChips=u=>u.traits.length?`<div class="traits">${u.traits.map(t=>{const T=TRAIT[t];return`<span class="trait ${T[1]>=2?'gold':T[1]>0?'good':T[1]<0?'bad':''}">${T[0]}</span>`}).join('')}</div>`:'';
const kChip=id=>{const o=S.kingdoms.find(q=>q.id===id);return o?`<span class="chip" style="color:${o.color}" data-act="k:${o.id}">${esc(o.name)}</span>`:''};
function loyBar(c){const v=c.loyal,col=c.k.capital===c?'var(--gold)':v>=25?'var(--peace)':v>=0?'#e8c547':'var(--war)';const w=c.k.capital===c?100:Math.max(4,Math.min(100,v+50));
  return`<div class="loy"><i style="width:${w}%;background:${col}"></i></div>`}
function updateInspect(){const el=$('inspect');if(!sel){el.hidden=true;return}
  let h='';
  if(sel.kind==='unit'){const u=sel.u,s=SP[u.sp];
    if(u.dead)h=`<h4>Défunt</h4><p class="k">${esc(u.name)} n'est plus de ce monde.</p>`;
    else{const role=u.role==='king'?`Souverain ${kDu(u.k)}`:u.role==='leader'&&u.city?`Chef de ${u.city.name}`:'';
      h=`<h4>${ico(u.sp)}${esc(s.civ||u.sp==='zombie'?u.name:cap(s.one))}</h4><p class="k">${esc(role||(u.city?u.city.name+(u.k?' · '+u.k.name:''):s.civ?'Sans foyer':cap(s.one)+' sauvage'))}</p>${traitChips(u)}
      <dl><dt>Activité</dt><dd>${u.sick?'Malade':activity(u)}</dd><dt>Âge</dt><dd>${Math.floor(u.age)} ans</dd><dt>Santé</dt><dd>${Math.max(0,Math.round(u.hp))} / ${Math.round(u.maxhp)}</dd><dt>Niveau</dt><dd>${u.lvl+1}</dd><dt>Victimes</dt><dd>${u.kills}</dd></dl>
      <div class="ibtns"><button class="ibtn" data-act="follow" aria-pressed="${follow===u}">Suivre</button>${u.city?`<button class="ibtn" data-act="c:${u.city.id}">Ville</button>`:''}${u.k?`<button class="ibtn" data-act="k:${u.k.id}">Royaume</button>`:''}</div>`}}
  else if(sel.kind==='city'){const c=sel.c;
    if(c.dead)h=`<h4>Ruines</h4><p class="k">${esc(c.name)} a disparu.</p>`;
    else{const sp=[[B.MILL,c.mills],[B.BARRACKS,c.barr],[B.TEMPLE,c.temples],[B.DOCKS,c.docks>=0?1:0],[B.MINE,c.mines]].filter(x=>x[1]).map(x=>BNAME[x[0]]+(x[1]>1?' ×'+x[1]:''));
      const reasons=c.k.capital===c?'<div class="reasons"><span>Capitale du royaume</span><b></b></div>':`<div class="reasons">${c.loyR.slice().sort((a,b)=>a[1]-b[1]).slice(0,4).map(([l,n])=>`<span>${l}</span><b>${n>0?'+':''}${n}</b>`).join('')}</div>`;
      h=`<h4><i class="sw" style="background:${c.k.color}"></i>${esc(c.name)}</h4><p class="k">${LVL[c.lvl]} ${SP[c.race].one} · ${esc(c.k.name)}</p>
      <dl><dt>Habitants</dt><dd>${c.pop} / ${cityCap(c)}</dd><dt>Chef</dt><dd>${c.leader&&!c.leader.dead?esc(c.leader.name):c.k.capital===c&&c.k.king?esc(c.k.king.name)+' (souverain)':'aucun'}</dd><dt>Maisons</dt><dd>${c.houses}</dd><dt>Champs</dt><dd>${c.fields}</dd><dt>Fondée</dt><dd>an ${Math.floor(c.founded/YEAR)}</dd></dl>
      <h5>Réserves</h5><div class="res"><div><span>Vivres</span><b>${c.starving?'0':Math.round(c.food)}</b></div><div><span>Bois</span><b>${Math.round(c.wood)}</b></div><div><span>Pierre</span><b>${Math.round(c.stone)}</b></div><div><span>Or</span><b>${Math.round(c.gold)}</b></div></div>
      ${sp.length?`<h5>Bâtiments</h5><p class="k" style="margin:0">${sp.join(' · ')}</p>`:''}
      <h5>Loyauté ${c.k.capital===c?'':`<span style="font-family:var(--mono);color:var(--fg)">${c.loyal}</span>`}</h5>${loyBar(c)}${reasons}
      <div class="ibtns"><button class="ibtn" data-act="k:${c.k.id}">Voir le royaume</button></div>`}}
  else if(sel.kind==='kingdom'){const k=sel.k;
    if(k.dead)h=`<h4>Royaume disparu</h4><p class="k">${esc(k.name)} n'existe plus.</p>`;
    else{const cs=S.cities.filter(c=>c.k===k).sort((a,b)=>b.pop-a.pop);const kg=k.king&&!k.king.dead?k.king:null;
      h=`<h4><i class="sw" style="background:${k.color}"></i>${esc(k.name)}</h4><p class="k">${SP[k.race].name} · ${cap(TIERS[k.tier])} · fondé an ${Math.floor(k.founded/YEAR)}</p>
      <dl><dt>Souverain</dt><dd>${kg?`<span data-act="u:king" style="cursor:pointer;text-decoration:underline">${esc(kg.name)}</span>, ${Math.floor(kg.age)} ans`:'trône vacant'}</dd><dt>Habitants</dt><dd>${k.pop}</dd><dt>Villes</dt><dd>${cs.length}</dd></dl>
      ${kg?traitChips(kg):''}
      ${k.allies.size?`<h5>Alliés</h5><div class="chips">${[...k.allies].map(id=>kChip(id).replace('class="chip"','class="chip ally"')).join('')}</div>`:''}
      ${k.wars.size?`<h5>En guerre contre</h5><div class="chips">${[...k.wars].map(kChip).join('')}</div>`:''}
      <h5>Villes</h5><ul class="clist">${cs.map(c=>`<li data-act="c:${c.id}"><span class="nm">${c===k.capital?'★ ':''}${esc(c.name)}</span><span class="v">${c.pop}</span><span class="v" style="color:${c===k.capital?'var(--gold)':c.loyal>=25?'var(--peace)':c.loyal>=0?'#e8c547':'var(--war)'}">${c===k.capital?'cap.':c.loyal}</span></li>`).join('')}</ul>`}}
  else{const i=sel.y*W+sel.x,c=cityAt(sel.x,sel.y);h=`<h4>${TNAMES[terr[i]]}${veg[i]?' boisée':''}</h4><p class="k">${terr[i]>=2?BIONAME[bio[i]]+' · ':''}${c?'territoire de '+esc(c.name):'terre sans maître'}${ore[i]?' · gisement '+(ore[i]===2?"d'or":'de fer'):''}</p>`}
  el.innerHTML=h+'<button class="x" data-act="close" aria-label="Fermer">×</button>';el.hidden=false}
$('inspect').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='close'){sel=null;follow=null}
  else if(a==='follow'&&sel&&sel.kind==='unit'){follow=follow===sel.u?null:sel.u;if(follow)cam.z=Math.max(cam.z,8)}
  else if(a==='u:king'&&sel.kind==='kingdom'&&sel.k.king){sel={kind:'unit',u:sel.k.king};centerOn(sel.u.x,sel.u.y,Math.max(cam.z,8))}
  else if(a.startsWith('c:')){const c=S.cityById.get(+a.slice(2));if(c){sel={kind:'city',c};follow=null;centerOn(c.x+.5,c.y+.5,Math.max(cam.z,6))}}
  else if(a.startsWith('k:')){const k=S.kingdoms.find(q=>q.id===+a.slice(2));if(k)sel={kind:'kingdom',k}}
  updateInspect()});

// ---- boucle
let lastT=performance.now(),sideT=0;
function loop(t){const dt=Math.min(100,t-lastT);lastT=t;
  if(speed){acc+=dt/1000*20*speed;const t0=performance.now();while(acc>=1&&performance.now()-t0<12){step();acc--}if(acc>8)acc=0}
  frame();sideT+=dt;if(sideT>400){sideT=0;updateSide(false)}
  requestAnimationFrame(loop)}
resize();newWorld(true);requestAnimationFrame(loop);
</script>

</body></html>
