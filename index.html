body{background:var(--bord);color:var(--creme);font-family:"VT323",monospace;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;gap:14px;padding:12px;transition:padding .25s;
  background-image:radial-gradient(color-mix(in srgb,var(--rouge) 45%,transparent) 1px,transparent 1.5px);background-size:12px 12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--creme);outline-offset:2px}
[hidden]{display:none!important}

.jeu{position:relative;container-type:inline-size;width:960px;height:640px;background:#000;flex:none;user-select:none;-webkit-user-select:none;overflow:hidden;
  box-shadow:0 0 0 4px var(--k),0 0 0 8px var(--rouge),0 0 0 12px var(--k),0 24px 50px rgba(0,0,0,.55)}
#ecran{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}

/* Écran titre */
.titre{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;text-align:center;cursor:pointer;
  background:color-mix(in srgb,var(--bord) 82%,transparent);font-family:"Press Start 2P",monospace}
.titre h1{margin:0;font-size:6.2cqw;font-weight:400;line-height:1.2;color:var(--creme);text-shadow:.6cqw .6cqw 0 var(--rouge),1.2cqw 1.2cqw 0 var(--k)}
.titre .sous{font-size:1.9cqw;letter-spacing:.3em;opacity:.85}
.titre .go{margin-top:4cqw;font-size:1.8cqw;animation:clignote 1s steps(2) infinite}
@keyframes clignote{50%{opacity:0}}

/* Dialogues */
.dialogue,.choix,.menu{position:absolute;z-index:45;background:#f8f8f0;color:#383840;font:max(10px,2.3cqw)/2 "Press Start 2P",monospace;
  text-shadow:max(1px,.22cqw) max(1px,.22cqw) 0 #d6d2c4;border:max(3px,.5cqw) solid #383040;border-radius:max(5px,1cqw);
  box-shadow:inset 0 0 0 max(2px,.4cqw) #f8f8f0,inset 0 0 0 max(5px,.95cqw) var(--rouge),inset 0 0 0 max(6px,1.2cqw) #f8f8f0}
.dialogue{left:1.5%;right:1.5%;bottom:2%;min-height:calc(4em + 6.4cqw);padding:3.2cqw 4.6cqw;cursor:pointer}
.dialogue p{margin:0;white-space:pre}
#dialogue-suite{position:absolute;right:4cqw;bottom:2.4cqw;color:#e03028;text-shadow:none;font-size:.8em;animation:rebond .6s steps(2) infinite}
@keyframes rebond{50%{transform:translateY(.25em)}}
.choix{right:1.5%;bottom:calc(4em + 6.4cqw + 4%);padding:2.4cqw 4cqw 2.4cqw 6cqw;line-height:2.2}
.menu{top:2%;right:1.5%;padding:2.4cqw 4cqw 2.4cqw 6cqw;line-height:2.2;z-index:44}
.menu div{position:relative;cursor:pointer;white-space:nowrap}
.menu div.sel::before{content:"▶";position:absolute;left:-3.2cqw;color:#383840}
.choix div{position:relative;cursor:pointer}
.choix div.sel::before{content:"▶";position:absolute;left:-3.2cqw;color:#383840}

/* Vues zoomées */
.vue{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;
  background:color-mix(in srgb,var(--k) 93%,transparent);transform:scale(.12);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s}
.vue.ouverte{transform:none;opacity:1}
.aide-vue{margin:0;font:max(8px,1.35cqw)/1.6 "Press Start 2P",monospace;color:var(--creme);opacity:.8;text-align:center;padding:0 3cqw}
.vue-fermer{position:absolute;top:2cqw;right:2cqw;background:var(--creme);color:var(--k);border:max(2px,.4cqw) solid var(--k);padding:1cqw 1.6cqw;font:max(8px,1.4cqw) "Press Start 2P",monospace;z-index:2}

/* Bureau */
.plateau{position:relative;width:88%;height:74%;border:max(3px,.6cqw) solid var(--k);overflow:hidden;
  background:repeating-linear-gradient(0deg,#b97a45 0 3cqw,#a96c3b 3cqw 3.2cqw,#b47443 3.2cqw 6.4cqw,#9d6234 6.4cqw 6.6cqw);display:flex;align-items:center;justify-content:center;gap:3cqw}
.feutre{position:absolute;height:1.7cqw;width:11cqw;border:max(2px,.3cqw) solid var(--k);display:flex}
.feutre i{display:block;height:100%}
.feutre i:nth-child(1){width:28%}.feutre i:nth-child(2){width:14%;background:#fff}.feutre i:nth-child(3){flex:1}
.feuille{position:relative;z-index:2;margin:0;width:38%;height:88%;background:#fffaf0;border:max(2px,.4cqw) solid var(--k);box-shadow:1cqw 1cqw 0 rgba(36,8,15,.45);padding:1.6cqw;display:flex;flex-direction:column;gap:1.2cqw;transform:rotate(-1.5deg)}
.feuille-img{position:relative;flex:1;min-height:0;background:var(--rouge);overflow:hidden;border:max(2px,.3cqw) solid var(--k)}
.feuille-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feuille-img .vide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5cqw;text-align:center;font:max(8px,1.7cqw)/1.6 "Press Start 2P",monospace;color:var(--creme)}
.feuille figcaption{color:var(--k);font:max(14px,2.4cqw)/1.05 "VT323",monospace;display:flex;justify-content:space-between;gap:1cqw}
.feuille figcaption strong{font-weight:400}
.fleche{position:relative;z-index:3;background:var(--creme);color:var(--k);border:max(2px,.45cqw) solid var(--k);width:6cqw;height:6cqw;font:max(10px,2cqw) "Press Start 2P",monospace;box-shadow:.5cqw .5cqw 0 var(--k)}
.fleche:active{transform:translate(.4cqw,.4cqw);box-shadow:none}

/* Ordinateur */
.moniteur{position:relative;width:62%;margin-bottom:3.6cqw;background:#2b2e38;border:max(3px,.5cqw) solid #121218;border-radius:max(6px,1.2cqw) max(6px,1.2cqw) 0 0;padding:1.6cqw 1.6cqw 1cqw}
.moniteur::after{content:"";position:absolute;left:-9%;right:-9%;top:100%;height:3.2cqw;background:linear-gradient(#dfe2ea,#aeb2be);border:max(3px,.5cqw) solid #121218;border-radius:0 0 max(10px,2cqw) max(10px,2cqw)}
.ecran-pc{position:relative;aspect-ratio:4/3;background:#1d0710;border:max(3px,.5cqw) solid var(--k);overflow:hidden;color:#f5dcb4;font:max(13px,2.3cqw)/1.15 "VT323",monospace}
.ecran-pc::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
.pc-zone{position:absolute;inset:0;padding:2.2cqw 2.6cqw;overflow:auto;scrollbar-width:thin}
.pc-zone h2{margin:0 0 1.4cqw;font:max(9px,1.6cqw)/1.5 "Press Start 2P",monospace;color:var(--creme)}
.pc-zone h3{margin:1.6cqw 0 .4cqw;font:max(8px,1.3cqw)/1.5 "Press Start 2P",monospace;color:#e8812f}
.pc-zone p{margin:.3cqw 0}
.pc-zone ul{margin:.3cqw 0;padding-left:2.4cqw}
.pc-zone a{color:#ffd28a}
.pc-liste{list-style:none;margin:0;padding:0}
.pc-liste li{position:relative;padding:.5cqw 0 .5cqw 2.6cqw;cursor:pointer}
.pc-liste li.sel{color:#fff;background:rgba(255,230,193,.1)}
.pc-liste li.sel::before{content:"▶";position:absolute;left:.4cqw;color:#e8812f;font-size:.8em;top:.75cqw}
.pc-zone img.cv{width:100%;margin-bottom:1.4cqw;border:2px solid #f5dcb4}
.pc-video{position:absolute;inset:0;background:#000}
.pc-video iframe,.pc-video video{width:100%;height:100%;border:0;display:block}
.pc-retour{position:absolute;left:1cqw;bottom:1cqw;z-index:3;background:var(--creme);color:var(--k);border:2px solid var(--k);font:max(8px,1.2cqw) "Press Start 2P",monospace;padding:.6cqw 1cqw}
.moniteur-pied{display:flex;justify-content:space-between;align-items:center;margin-top:1cqw;color:#9aa0ae;font:max(7px,1.1cqw) "Press Start 2P",monospace}
.moniteur-pied i{width:1.4cqw;height:1.4cqw;background:#3fbf5f;border:2px solid var(--k);display:block}

/* Terrarium */
.borne-cadre{width:96%;height:94%;display:flex;flex-direction:column;gap:1.2cqw;padding:1.4cqw;background:#15121f;border:max(3px,.5cqw) solid #000;border-radius:max(6px,1.4cqw);box-shadow:0 0 0 max(2px,.35cqw) #ff4fa0,0 0 3cqw rgba(255,79,160,.45)}
.borne-haut{text-align:center;font:max(9px,2.2cqw)/1.6 "Press Start 2P",monospace;color:#fff6fc;text-shadow:0 0 .8cqw #ff4fa0,0 0 1.6cqw #ff4fa0}
.borne-ecran{flex:1;min-height:0;background:#000;border:max(3px,.5cqw) solid #06040e;border-radius:max(4px,.8cqw);overflow:hidden}
.borne-ecran iframe{width:100%;height:100%;border:0;display:block;background:#000}
.borne-bas{display:flex;justify-content:center;gap:2cqw}
.borne-btn{background:#ffe14a;color:#1a1036;border:max(2px,.4cqw) solid #000;font:max(8px,1.4cqw) "Press Start 2P",monospace;padding:1cqw 1.6cqw;text-decoration:none;cursor:pointer}
.livre{position:relative;width:86%;aspect-ratio:1.5;display:flex;gap:0;padding:1.3cqw;background:#7a2a3a;border:max(3px,.5cqw) solid #2a0a12;border-radius:max(4px,.8cqw);box-shadow:0 1.4cqw 0 #3a1018,0 2cqw 3cqw rgba(0,0,0,.5);perspective:2400px}
.page{position:relative;flex:1;min-width:0;background:#fbf6e8;color:#2a1a10;font:max(14px,2.3cqw)/1.15 "VT323",monospace;padding:2.4cqw 2.6cqw 3.6cqw;overflow:auto;scrollbar-width:thin}
.page.gauche{box-shadow:inset -2.2cqw 0 2cqw -1.4cqw rgba(90,50,20,.35);border-radius:3px 0 0 3px}
.page.droite{box-shadow:inset 2.2cqw 0 2cqw -1.4cqw rgba(90,50,20,.35);border-radius:0 3px 3px 0}
.page img{display:block;max-width:100%;max-height:52%;margin:0 auto 1.2cqw;border:max(2px,.3cqw) solid #2a1a10;cursor:zoom-in;object-fit:contain}
.page p{margin:0 0 .6em;white-space:pre-wrap}
.page-num{position:absolute;bottom:1cqw;left:0;right:0;text-align:center;font-size:.85em;opacity:.55}
.page-titre{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.4cqw}
.page-titre h3{margin:0;font:max(11px,2.6cqw)/1.5 "Press Start 2P",monospace;color:#7a2a3a}
.page-titre p{margin:0;opacity:.75}
.page-fin{height:100%;display:flex;align-items:center;justify-content:center;opacity:.45}
.tourne-page{position:absolute;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.1,.3,1);z-index:3;pointer-events:none}
.tourne-page .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.tourne-page .dos{transform:rotateY(180deg)}
.livre-nav{display:flex;align-items:center;gap:3cqw;font:max(9px,1.6cqw) "Press Start 2P",monospace;color:var(--creme)}
.livre-nav .fleche[disabled]{opacity:.35;cursor:default}
.grand{position:fixed;inset:0;z-index:70;background:rgba(14,4,8,.95);display:flex;align-items:center;justify-content:center;padding:56px 70px 24px}
.grand figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;max-height:100%}
.grand img{max-width:min(92vw,1600px);max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px);object-fit:contain;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px var(--rouge)}
.grand figcaption{text-align:center;color:var(--creme);font:20px/1.25 "VT323",monospace;max-width:70ch}
.grand figcaption strong{display:block;font:400 12px/1.6 "Press Start 2P",monospace;margin-bottom:4px}
.grand-btn,.grand-fermer{position:absolute;background:var(--creme);color:var(--k);border:3px solid var(--k);font:12px "Press Start 2P",monospace;cursor:pointer}
.grand-btn{top:50%;transform:translateY(-50%);width:48px;height:48px}.grand-prec{left:12px}.grand-suiv{right:12px}
.grand-fermer{top:12px;right:12px;padding:9px 12px}
.grand-n{position:absolute;top:18px;left:16px;color:var(--creme);font:11px "Press Start 2P",monospace;opacity:.8}
.pc-lien{display:inline-block;margin:1cqw 0;padding:.6cqw 1.2cqw;border:2px solid #ffd28a;color:#ffd28a;cursor:pointer;background:none;font:inherit}
.pc-lien:hover,.pc-lien.sel{background:#ffd28a;color:#1d0710}
.pc-zone img.cv{cursor:zoom-in}
@media (max-width:700px){ .grand{padding:52px 8px 16px} .grand-btn{top:auto;bottom:14px;transform:none} .grand img{max-height:calc(100dvh - 210px)} }
.vitre{width:70%;border:max(4px,.9cqw) solid var(--k);box-shadow:inset 0 0 0 max(2px,.4cqw) #6f8a87,0 0 0 max(2px,.4cqw) #3a2a26}
#terra{width:100%;display:block;image-rendering:pixelated;cursor:pointer}

.fondu{position:absolute;inset:0;z-index:48;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.fondu.noir{opacity:1}
.boutons-haut{position:absolute;top:1.4cqw;right:1.4cqw;z-index:35;display:flex;gap:1cqw}
.jeu.en-vue .boutons-haut{display:none}
.lieu{position:absolute;top:0;left:3%;z-index:36;background:#f8f8f0;color:#383840;font:max(9px,1.9cqw)/1 "Press Start 2P",monospace;text-shadow:max(1px,.2cqw) max(1px,.2cqw) 0 #d6d2c4;
  padding:2.4cqw 4cqw 2cqw;border:max(3px,.5cqw) solid #383040;border-top:0;border-radius:0 0 max(5px,1cqw) max(5px,1cqw);
  box-shadow:inset 0 0 0 max(2px,.4cqw) #f8f8f0,inset 0 0 0 max(5px,.95cqw) var(--rouge),inset 0 0 0 max(6px,1.2cqw) #f8f8f0;transform:translateY(-110%);transition:transform .3s steps(5)}
.lieu.visible{transform:none}
.bouton-son,.bouton-menu{background:var(--papier);color:var(--k);border:max(2px,.4cqw) solid var(--k);font:max(8px,1.2cqw) "Press Start 2P",monospace;padding:.8cqw 1.1cqw}

/* Manette tactile */
.manette{display:none;width:min(100%,520px);justify-content:space-between;align-items:center;padding:0 6px;touch-action:none;user-select:none;-webkit-user-select:none}
@media (hover:none) and (pointer:coarse){
  .manette{display:flex}
  body{padding:0 0 8px;gap:6px;justify-content:flex-start;background:#000;background-image:none}
  .jeu{box-shadow:none;border-bottom:3px solid var(--rouge);width:100vw;max-width:100vw;height:60vh}
  .dialogue{min-height:calc(4em + 30px);padding:15px 18px;font-size:max(10px,2.6cqw);left:6px;right:6px;bottom:6px}
  .choix{font-size:max(10px,2.6cqw);right:6px;bottom:calc(4em + 46px);padding:12px 16px 12px 28px}
  .menu{font-size:max(10px,2.6cqw);padding:12px 16px 12px 28px}
  .choix div.sel::before,.menu div.sel::before{left:-16px}
  .aide-vue{font-size:9px}
  .vue-fermer,.bouton-son,.bouton-menu{font-size:9px;padding:7px 9px}
  .lieu{font-size:10px;padding:14px 18px 12px}
}
.croix{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
.croix button,.ab button{background:var(--creme);color:var(--k);border:3px solid var(--k);font:14px "Press Start 2P",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
.croix button:active,.ab button:active,.croix button.appui,.ab button.appui{background:#e3c193}
.croix [data-k=haut]{grid-area:1/2}.croix [data-k=gauche]{grid-area:2/1}.croix [data-k=droite]{grid-area:2/3}.croix [data-k=bas]{grid-area:3/2}
.croix .centre{grid-area:2/2;background:var(--creme);border:3px solid var(--k)}
.ab{display:flex;gap:16px;align-items:center}
.start{align-self:flex-end;margin-bottom:6px}
.start button{background:#3a2a32;color:var(--creme);border:3px solid var(--k);border-radius:999px;padding:7px 12px;font:9px "Press Start 2P",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
.start button.appui{background:#5a4450}
.ab button{width:64px;height:64px;border-radius:50%;font-size:18px;background:var(--rouge);color:var(--creme)}
.ab button[data-k=B]{transform:translateY(22px);background:var(--bord)}
.start button[data-k=SELECT]{display:none}
/* ── Téléphone en hauteur : une console de poche ── */
body.gb{background:#ddd2bb;background-image:none;justify-content:flex-start;align-items:stretch;padding:12px 12px 10px;gap:0;min-height:100vh;min-height:100dvh;overflow:hidden}
.gb .boitier{background:#3d3646;border-radius:12px 12px 44px 12px;padding:16px 16px 8px;box-shadow:inset 0 0 0 2px #2a2430,0 3px 0 #b8ab92}
.gb .jeu{box-shadow:0 0 0 3px #15121a;border:0;max-width:none;margin:0 auto}
.gb .boitier-bas{display:flex;align-items:center;gap:7px;margin-top:9px;font:8px "Press Start 2P",monospace;color:#9a90a6;letter-spacing:.08em}
.gb .led{width:8px;height:8px;border-radius:50%;background:#ff3a4a;box-shadow:0 0 7px #ff3a4a}
.gb .marque{margin:14px 6px 0;display:flex;align-items:baseline;gap:8px;color:#7a2a3a;font:italic 13px "Press Start 2P",monospace;letter-spacing:.04em}
.gb .marque small{font-size:8px;color:#3d3646;font-style:normal;letter-spacing:.2em}
.gb .manette{flex:none;width:100%;position:relative;align-items:center;justify-content:space-between;padding:0 4px;margin-top:6px;height:200px}
.gb .croix{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);filter:drop-shadow(0 3px 0 #b8ab92)}
.gb .croix button{background:#2c2733;color:#6a6474;border:0;border-radius:4px;font-size:12px}
.gb .croix .centre{background:#2c2733;border:0}
.gb .croix button.appui,.gb .croix button:active{background:#1a1720}
.gb .ab{gap:14px;transform:rotate(-24deg);margin-right:8px}
.gb .ab button{width:62px;height:62px;border-radius:50%;background:#9a2350;color:#f4d6e2;border:0;box-shadow:0 4px 0 #5e1230;font-size:16px}
.gb .ab button[data-k=B]{transform:translateY(26px)}
.gb .ab button.appui,.gb .ab button:active{box-shadow:0 1px 0 #5e1230;translate:0 3px}
.gb .start{position:absolute;left:50%;bottom:6px;transform:translateX(-50%) rotate(-24deg);display:flex;gap:16px;margin:0}
.gb .start button[data-k=SELECT]{display:block}
.gb .start button{background:#8a8494;color:#3d3646;border:0;border-radius:999px;width:52px;height:13px;padding:0;font-size:0;box-shadow:0 2px 0 #6a6474;position:relative}
.gb .start button::after{content:attr(data-k);position:absolute;top:19px;left:50%;transform:translateX(-50%);font:7px "Press Start 2P",monospace;color:#5a5068;letter-spacing:.05em}
.gb .hautparleur{position:absolute;right:6px;bottom:-14px;display:flex;gap:6px;transform:rotate(-24deg)}
.gb .hautparleur i{display:block;width:6px;height:44px;border-radius:3px;background:#c6b99e;box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
.gb .bouton-son,.gb .bouton-menu{display:none}
.gb .coordonnees{font-size:12px;color:#6a5f5a;margin-top:auto;padding-top:14px;line-height:1.5}
.gb .coordonnees a{color:#5a4f4a;border-color:rgba(90,79,74,.35)}
@media (max-height:760px){.gb .manette{height:172px;margin-top:0}.gb .croix{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.gb .ab button{width:54px;height:54px}.gb .ab button[data-k=B]{transform:translateY(22px)}.gb .marque{margin-top:9px}.gb .boitier{padding:12px 14px 6px}.gb .boitier-bas{margin-top:6px}.gb .coordonnees{padding-top:8px;line-height:1.4}.gb .hautparleur i{height:36px}}
@media (max-width:430px){
  .manette{padding:0 4px}
  .croix{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
  .ab{gap:10px}.ab button{width:56px;height:56px;font-size:16px}
  .start button{padding:6px 9px;font-size:8px}
}

.coordonnees{font-size:22px;text-align:center;line-height:1.3;opacity:.92}
.coordonnees a{color:var(--creme);text-decoration:none;border-bottom:1px solid rgba(255,230,193,.4)}
.coordonnees a:hover{border-color:var(--creme)}
.coordonnees span{margin:0 .5em;opacity:.5}
@media (max-width:600px){ .coordonnees{font-size:18px} .coordonnees span{display:block;height:0;overflow:hidden} }

@media (prefers-reduced-motion:reduce){ .vue{transition:opacity .2s} .titre .go,#dialogue-suite{animation:none} }

/* ── Éditeur (mode édition uniquement) ── */

/* Livre de la bibliothèque */
let lpage = 0, tourne = false;
const livreSimple = () => { const j = $("#jeu"); return j.clientWidth < j.clientHeight; };
function pagesLivre() { return [{ couverture: true }, ...S.livre.pages]; }
function htmlPage(p, num) {
  if (!p) return `<div class="page-fin">~</div>`;
  if (p.couverture) return `<div class="page-titre"><h3>${esc(S.livre.titre || "Mon carnet")}</h3><p>${esc(nom())}</p></div>`;
  return `${p.image ? `<img src="${esc(p.image)}" alt="" data-grand="${num}">` : ""}${paragraphes(p.texte)}<span class="page-num">${num}</span>`;
}
function paragraphes(t) { return String(t || "").split(/\n\s*\n/).map(x => x.trim()).filter(Boolean).map(x => `<p>${esc(x)}</p>`).join(""); }
function rendreLivre() {
  const P = pagesLivre(), n = P.length, simple = livreSimple();
  if (simple) { lpage = Math.max(0, Math.min(lpage, n - 1)); $("#page-d").innerHTML = htmlPage(P[lpage], lpage); $("#page-g").innerHTML = ""; $("#livre-n").textContent = `${lpage + 1}/${n}`; }
  else { lpage = Math.max(0, Math.min(lpage - (lpage % 2), n - 1)); $("#page-g").innerHTML = htmlPage(P[lpage], lpage); $("#page-d").innerHTML = htmlPage(P[lpage + 1], lpage + 1); $("#livre-n").textContent = `${Math.floor(lpage / 2) + 1}/${Math.ceil(n / 2)}`; }
  const pas = simple ? 1 : 2;
  $('[data-livre="-1"]').disabled = lpage === 0; $('[data-livre="1"]').disabled = lpage + pas >= n;
  $("#page-g").scrollTop = 0; $("#page-d").scrollTop = 0;
}
function ouvrirLivre() { lpage = 0; ouvrirVue("livre", carte().objets.find(o => o.x === 1 && o.y === 3)); rendreLivre(); Son.bip(700, .06, "triangle", .03); }
function tournerPage(sens) {
  if (tourne) return;
  const P = pagesLivre(), n = P.length, simple = livreSimple(), pas = simple ? 1 : 2, cible = lpage + sens * pas;
  if (cible < 0 || cible >= n) return;
  Son.bip(1300, .04, "triangle", .02); setTimeout(() => Son.bip(900, .05, "triangle", .02), 90);
  if (simple || matchMedia("(prefers-reduced-motion: reduce)").matches) { lpage = cible; rendreLivre(); return; }
  tourne = true;
  const livre = $("#livre"), dessous = sens > 0 ? $("#page-d") : $("#page-g"), dessus = sens > 0 ? $("#page-g") : $("#page-d");
  const f = document.createElement("div"); f.className = "tourne-page";
  Object.assign(f.style, { left: dessous.offsetLeft + "px", top: dessous.offsetTop + "px", width: dessous.offsetWidth + "px", height: dessous.offsetHeight + "px", transformOrigin: sens > 0 ? "left center" : "right center" });
  const recto = sens > 0 ? htmlPage(P[lpage + 1], lpage + 1) : htmlPage(P[lpage], lpage), verso = sens > 0 ? htmlPage(P[cible], cible) : htmlPage(P[cible + 1], cible + 1);
  f.innerHTML = `<div class="face page ${sens > 0 ? "droite" : "gauche"}">${recto}</div><div class="face dos page ${sens > 0 ? "gauche" : "droite"}">${verso}</div>`;
  livre.append(f);
  dessous.innerHTML = sens > 0 ? htmlPage(P[cible + 1], cible + 1) : htmlPage(P[cible], cible);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `rotateY(${sens > 0 ? -180 : 180}deg)`; }));
  setTimeout(() => { lpage = cible; rendreLivre(); f.remove(); tourne = false; }, 680);
}

/* ═════════ Déplacements ═════════ */
const tenu = new Map();     // direction -> moment de l'appui
let chemin = [], apresChemin = null;
const VUE = { w: VW, h: VH, sN: E, ky: E };
const camAxe = (p, taille, v) => taille <= v ? -(v - taille) / 2 : Math.max(0, Math.min(taille - v, p - v / 2));
function cam() {
  const c = carte(), px = (J.x + (J.bouge ? J.dx * J.prog : 0)) * T + 8, py = (J.y + (J.bouge ? J.dy * J.prog : 0)) * T + 8;
  return [Math.round(camAxe(px, c.w * T, VUE.w)), Math.round(camAxe(py, c.h * T, VUE.h))];
}
function tenterPas(dir) {
  J.dir = dir; const [dx, dy] = DIRS[dir], nx = J.x + dx, ny = J.y + dy;
  if (solide(nx, ny)) {
    const o = objetEn(nx, ny);
    if (o?.porte) { chemin = []; script(o.action); }
    else { const t = performance.now(); if (t - J.choc > 320) { J.choc = t; J.alterne = 3 - J.alterne; Son.bip(95, .09, "square", .06); } }
    return false;

}
function libre() { return !D && !vue && !occupe && !titreActif && !menuOuvert; }
function majJoueur(dt) {
  if (J.bouge) {
    J.prog += dt / 230;
    J.pas = J.prog < .5 ? J.alterne : 0;
    if (J.prog >= 1) { J.x += J.dx; J.y += J.dy; J.bouge = false; J.prog = 0; J.pas = 0; }
    else return;
  }
  if (!libre() || J.couche) return;
  if (chemin.length) {
    if (!tenterPas(chemin.shift())) chemin = [];
    if (!chemin.length && !J.bouge && apresChemin) { const f = apresChemin; apresChemin = null; f(); }
    return;
  }
  if (apresChemin && !J.bouge) { const f = apresChemin; apresChemin = null; f(); return; }

  for (const [d, t] of tenu) if (t >= t0) { dir = d; t0 = t; }

  if (o?.action) { Son.bip(990, .05); script(o.action); }
}

/* Clic / toucher : on marche jusqu'à la case, et on interagit si c'est un objet */
function chercher(cibles) {
  const c = carte(), cle = (x, y) => y * c.w + x, vus = new Map([[cle(J.x, J.y), null]]), file = [[J.x, J.y]];
  while (file.length) {
    const [x, y] = file.shift();
    if (cibles.some(([a, b]) => a === x && b === y)) {
      const res = []; let k = cle(x, y);
      while (vus.get(k)) { const [d, prev] = vus.get(k); res.unshift(d); k = prev; }
      return { res, x, y };
    }
    for (const d in DIRS) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1], k = cle(nx, ny);
      if (!vus.has(k) && !solide(nx, ny)) { vus.set(k, [d, cle(x, y)]); file.push([nx, ny]); }
    }
  }
  return null;
}

const TOUCHES = { ArrowUp:"haut", KeyW:"haut", ArrowDown:"bas", KeyS:"bas", ArrowLeft:"gauche", KeyA:"gauche", ArrowRight:"droite", KeyD:"droite",
  Enter:"A", Space:"A", KeyE:"A", NumpadEnter:"A", Escape:"B", Backspace:"B", KeyX:"B", ShiftLeft:"START", ShiftRight:"START" };
function presser(k, repete) {

  if (grand) { if (!repete) toucheGrand(k); return; }
  if (D) { if (!repete || k === "haut" || k === "bas") toucheDialogue(k); return; }

  if (k === "SELECT") { if (!repete) { Son.basculer(); majMenu(); afficherLieu(Son.actif ? "♪ SON : OUI" : "♪ SON : NON"); } return; }
  if (J.couche) {
    if (repete) return;

    else if (k === "gauche" || k === "droite") script(() => changerPiste(k === "droite" ? 1 : -1));
    return;
  }
  if (DIRS[k]) { chemin = []; apresChemin = null; if (!tenu.has(k)) tenu.set(k, performance.now()); }

function compresserIcone(fichier) {
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onerror = ko;
    r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => {
      const n = 64, c = document.createElement("canvas"); c.width = c.height = n;
      const x = c.getContext("2d"), k = Math.min(n / img.width, n / img.height), w = img.width * k, h = img.height * k;
      x.imageSmoothingEnabled = Math.max(img.width, img.height) > n;
      x.drawImage(img, (n - w) / 2, (n - h) / 2, w, h); ok(c.toDataURL("image/png")); }; img.src = r.result; };
    r.readAsDataURL(fichier);
  });
}
function compresser(fichier, max, qualite = .82) {
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onerror = ko;
    r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", qualite)); }; img.src = r.result; };
    r.readAsDataURL(fichier);
  });
}

function genererHTML() {

  return SOURCE.slice(0, debut) + `const SITE = ${json};\n` + SOURCE.slice(fin);
}
function telecharger() {

  const a = document.createElement("a"); a.href = url; a.download = "index.html"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function enBase64(texte) {
  const o = new TextEncoder().encode(texte); let bin = "";
  for (let i = 0; i < o.length; i += 0x8000) bin += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000));
  return btoa(bin);
}
let enCours = false;

  const api = `https://api.github.com/repos/${encodeURIComponent(gh.proprietaire)}/${encodeURIComponent(gh.depot)}/contents/${gh.chemin.split("/").map(encodeURIComponent).join("/")}`;
  const ent = { "Authorization": "Bearer " + gh.jeton, "X-GitHub-Api-Version": "2022-11-28" };

    let sha;
