body{background:var(--bord);color:var(--creme);font-family:"VT323",monospace;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;gap:14px;padding:12px;transition:padding .25s;
  background-image:radial-gradient(color-mix(in srgb,var(--rouge) 45%,transparent) 1px,transparent 1.5px);background-size:12px 12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--creme);outline-offset:2px}
[hidden]{display:none!important}

.jeu{position:relative;container-type:inline-size;width:960px;height:640px;background:#000;flex:none;user-select:none;-webkit-user-select:none;overflow:hidden;
  box-shadow:0 0 0 4px var(--k),0 0 0 8px var(--rouge),0 0 0 12px var(--k),0 24px 50px rgba(0,0,0,.55)}
#ecran{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}

/* Écran titre */
.titre{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;text-align:center;cursor:pointer;
  background:color-mix(in srgb,var(--bord) 82%,transparent);font-family:"Press Start 2P",monospace}
.titre h1{margin:0;font-size:6.2cqw;font-weight:400;line-height:1.2;color:var(--creme);text-shadow:.6cqw .6cqw 0 var(--rouge),1.2cqw 1.2cqw 0 var(--k)}
.titre .sous{font-size:1.9cqw;letter-spacing:.3em;opacity:.85}
.titre .go{margin-top:4cqw;font-size:1.8cqw;animation:clignote 1s steps(2) infinite}
@keyframes clignote{50%{opacity:0}}

/* Dialogues */
.dialogue,.choix,.menu{position:absolute;z-index:45;background:#f8f8f0;color:#383840;font:max(10px,2.3cqw)/2 "Press Start 2P",monospace;
  text-shadow:max(1px,.22cqw) max(1px,.22cqw) 0 #d6d2c4;border:max(3px,.5cqw) solid #383040;border-radius:max(5px,1cqw);
  box-shadow:inset 0 0 0 max(2px,.4cqw) #f8f8f0,inset 0 0 0 max(5px,.95cqw) var(--rouge),inset 0 0 0 max(6px,1.2cqw) #f8f8f0}
.dialogue{left:1.5%;right:1.5%;bottom:2%;min-height:calc(4em + 6.4cqw);padding:3.2cqw 4.6cqw;cursor:pointer}
.dialogue p{margin:0;white-space:pre}
#dialogue-suite{position:absolute;right:4cqw;bottom:2.4cqw;color:#e03028;text-shadow:none;font-size:.8em;animation:rebond .6s steps(2) infinite}
@keyframes rebond{50%{transform:translateY(.25em)}}
.choix{right:1.5%;bottom:calc(4em + 6.4cqw + 4%);padding:2.4cqw 4cqw 2.4cqw 6cqw;line-height:2.2}
.menu{top:2%;right:1.5%;padding:2.4cqw 4cqw 2.4cqw 6cqw;line-height:2.2;z-index:44}
.menu div{position:relative;cursor:pointer;white-space:nowrap}
.menu div.sel::before{content:"▶";position:absolute;left:-3.2cqw;color:#383840}
.choix div{position:relative;cursor:pointer}
.choix div.sel::before{content:"▶";position:absolute;left:-3.2cqw;color:#383840}

/* Vues zoomées */
.vue{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;
  background:color-mix(in srgb,var(--k) 93%,transparent);transform:scale(.12);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s}
.vue.ouverte{transform:none;opacity:1}
.aide-vue{margin:0;font:max(8px,1.35cqw)/1.6 "Press Start 2P",monospace;color:var(--creme);opacity:.8;text-align:center;padding:0 3cqw}
.vue-fermer{position:absolute;top:2cqw;right:2cqw;background:var(--creme);color:var(--k);border:max(2px,.4cqw) solid var(--k);padding:1cqw 1.6cqw;font:max(8px,1.4cqw) "Press Start 2P",monospace;z-index:2}

/* Bureau */
.plateau{position:relative;width:88%;height:74%;border:max(3px,.6cqw) solid var(--k);overflow:hidden;
  background:repeating-linear-gradient(0deg,#b97a45 0 3cqw,#a96c3b 3cqw 3.2cqw,#b47443 3.2cqw 6.4cqw,#9d6234 6.4cqw 6.6cqw);display:flex;align-items:center;justify-content:center;gap:3cqw}
.feutre{position:absolute;height:1.7cqw;width:11cqw;border:max(2px,.3cqw) solid var(--k);display:flex}
.feutre i{display:block;height:100%}
.feutre i:nth-child(1){width:28%}.feutre i:nth-child(2){width:14%;background:#fff}.feutre i:nth-child(3){flex:1}
.feuille{position:relative;z-index:2;margin:0;width:38%;height:88%;background:#fffaf0;border:max(2px,.4cqw) solid var(--k);box-shadow:1cqw 1cqw 0 rgba(36,8,15,.45);padding:1.6cqw;display:flex;flex-direction:column;gap:1.2cqw;transform:rotate(-1.5deg)}
.feuille-img{position:relative;flex:1;min-height:0;background:var(--rouge);overflow:hidden;border:max(2px,.3cqw) solid var(--k)}
.feuille-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feuille-img .vide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.5cqw;text-align:center;font:max(8px,1.7cqw)/1.6 "Press Start 2P",monospace;color:var(--creme)}
.feuille figcaption{color:var(--k);font:max(14px,2.4cqw)/1.05 "VT323",monospace;display:flex;justify-content:space-between;gap:1cqw}
.feuille figcaption strong{font-weight:400}
.fleche{position:relative;z-index:3;background:var(--creme);color:var(--k);border:max(2px,.45cqw) solid var(--k);width:6cqw;height:6cqw;font:max(10px,2cqw) "Press Start 2P",monospace;box-shadow:.5cqw .5cqw 0 var(--k)}
.fleche:active{transform:translate(.4cqw,.4cqw);box-shadow:none}

/* Ordinateur */
.moniteur{position:relative;width:62%;margin-bottom:3.6cqw;background:#2b2e38;border:max(3px,.5cqw) solid #121218;border-radius:max(6px,1.2cqw) max(6px,1.2cqw) 0 0;padding:1.6cqw 1.6cqw 1cqw}
.moniteur::after{content:"";position:absolute;left:-9%;right:-9%;top:100%;height:3.2cqw;background:linear-gradient(#dfe2ea,#aeb2be);border:max(3px,.5cqw) solid #121218;border-radius:0 0 max(10px,2cqw) max(10px,2cqw)}
.ecran-pc{position:relative;aspect-ratio:4/3;background:#1d0710;border:max(3px,.5cqw) solid var(--k);overflow:hidden;color:#f5dcb4;font:max(13px,2.3cqw)/1.15 "VT323",monospace}
.ecran-pc::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
.pc-zone{position:absolute;inset:0;padding:2.2cqw 2.6cqw;overflow:auto;scrollbar-width:thin}
.pc-zone h2{margin:0 0 1.4cqw;font:max(9px,1.6cqw)/1.5 "Press Start 2P",monospace;color:var(--creme)}
.pc-zone h3{margin:1.6cqw 0 .4cqw;font:max(8px,1.3cqw)/1.5 "Press Start 2P",monospace;color:#e8812f}
.pc-zone p{margin:.3cqw 0}
.pc-zone ul{margin:.3cqw 0;padding-left:2.4cqw}
.pc-zone a{color:#ffd28a}
.pc-liste{list-style:none;margin:0;padding:0}
.pc-liste li{position:relative;padding:.5cqw 0 .5cqw 2.6cqw;cursor:pointer}
.pc-liste li.sel{color:#fff;background:rgba(255,230,193,.1)}
.pc-liste li.sel::before{content:"▶";position:absolute;left:.4cqw;color:#e8812f;font-size:.8em;top:.75cqw}
.pc-zone img.cv{width:100%;margin-bottom:1.4cqw;border:2px solid #f5dcb4}
.pc-video{position:absolute;inset:0;background:#000}
.pc-video iframe,.pc-video video{width:100%;height:100%;border:0;display:block}
.pc-retour{position:absolute;left:1cqw;bottom:1cqw;z-index:3;background:var(--creme);color:var(--k);border:2px solid var(--k);font:max(8px,1.2cqw) "Press Start 2P",monospace;padding:.6cqw 1cqw}
.moniteur-pied{display:flex;justify-content:space-between;align-items:center;margin-top:1cqw;color:#9aa0ae;font:max(7px,1.1cqw) "Press Start 2P",monospace}
.moniteur-pied i{width:1.4cqw;height:1.4cqw;background:#3fbf5f;border:2px solid var(--k);display:block}

/* Terrarium */
.borne-cadre{width:96%;height:94%;display:flex;flex-direction:column;gap:1.2cqw;padding:1.4cqw;background:#15121f;border:max(3px,.5cqw) solid #000;border-radius:max(6px,1.4cqw);box-shadow:0 0 0 max(2px,.35cqw) #ff4fa0,0 0 3cqw rgba(255,79,160,.45)}
.borne-haut{text-align:center;font:max(9px,2.2cqw)/1.6 "Press Start 2P",monospace;color:#fff6fc;text-shadow:0 0 .8cqw #ff4fa0,0 0 1.6cqw #ff4fa0}
.borne-ecran{flex:1;min-height:0;background:#000;border:max(3px,.5cqw) solid #06040e;border-radius:max(4px,.8cqw);overflow:hidden}
.borne-ecran iframe{width:100%;height:100%;border:0;display:block;background:#000}
.borne-bas{display:flex;justify-content:center;gap:2cqw}
.borne-btn{background:#ffe14a;color:#1a1036;border:max(2px,.4cqw) solid #000;font:max(8px,1.4cqw) "Press Start 2P",monospace;padding:1cqw 1.6cqw;text-decoration:none;cursor:pointer}
.vitre{width:70%;border:max(4px,.9cqw) solid var(--k);box-shadow:inset 0 0 0 max(2px,.4cqw) #6f8a87,0 0 0 max(2px,.4cqw) #3a2a26}
#terra{width:100%;display:block;image-rendering:pixelated;cursor:pointer}

.fondu{position:absolute;inset:0;z-index:48;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.fondu.noir{opacity:1}
.boutons-haut{position:absolute;top:1.4cqw;right:1.4cqw;z-index:35;display:flex;gap:1cqw}
.jeu.en-vue .boutons-haut{display:none}
.lieu{position:absolute;top:0;left:3%;z-index:36;background:#f8f8f0;color:#383840;font:max(9px,1.9cqw)/1 "Press Start 2P",monospace;text-shadow:max(1px,.2cqw) max(1px,.2cqw) 0 #d6d2c4;
  padding:2.4cqw 4cqw 2cqw;border:max(3px,.5cqw) solid #383040;border-top:0;border-radius:0 0 max(5px,1cqw) max(5px,1cqw);
  box-shadow:inset 0 0 0 max(2px,.4cqw) #f8f8f0,inset 0 0 0 max(5px,.95cqw) var(--rouge),inset 0 0 0 max(6px,1.2cqw) #f8f8f0;transform:translateY(-110%);transition:transform .3s steps(5)}
.lieu.visible{transform:none}
.bouton-son,.bouton-menu{background:var(--papier);color:var(--k);border:max(2px,.4cqw) solid var(--k);font:max(8px,1.2cqw) "Press Start 2P",monospace;padding:.8cqw 1.1cqw}

/* Manette tactile */
.manette{display:none;width:min(100%,520px);justify-content:space-between;align-items:center;padding:0 6px;touch-action:none;user-select:none;-webkit-user-select:none}
@media (hover:none) and (pointer:coarse){
  .manette{display:flex}
  body{padding:0 0 8px;gap:6px;justify-content:flex-start;background:#000;background-image:none}
  .jeu{box-shadow:none;border-bottom:3px solid var(--rouge)}
  .dialogue{min-height:calc(4em + 30px);padding:15px 18px;font-size:max(10px,2.6cqw);left:6px;right:6px;bottom:6px}
  .choix{font-size:max(10px,2.6cqw);right:6px;bottom:calc(4em + 46px);padding:12px 16px 12px 28px}
  .menu{font-size:max(10px,2.6cqw);padding:12px 16px 12px 28px}
  .choix div.sel::before,.menu div.sel::before{left:-16px}
  .aide-vue{font-size:9px}
  .vue-fermer,.bouton-son,.bouton-menu{font-size:9px;padding:7px 9px}
  .lieu{font-size:10px;padding:14px 18px 12px}
}
@media (hover:none) and (pointer:coarse) and (orientation:portrait){
  .plateau{width:96%;height:62%;gap:2cqw}
  .feuille{width:62%}
  .fleche{width:11cqw;height:11cqw;font-size:12px}
  .feutre{height:3cqw;width:20cqw}
  .feuille figcaption{font-size:18px}
  .moniteur{width:82%}
  .ecran-pc{font-size:17px}
  .pc-zone h2{font-size:10px}.pc-zone h3{font-size:9px}
  .vitre{width:96%}
}
.croix{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
.croix button,.ab button{background:var(--creme);color:var(--k);border:3px solid var(--k);font:14px "Press Start 2P",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
.croix button:active,.ab button:active,.croix button.appui,.ab button.appui{background:#e3c193}
.croix [data-k=haut]{grid-area:1/2}.croix [data-k=gauche]{grid-area:2/1}.croix [data-k=droite]{grid-area:2/3}.croix [data-k=bas]{grid-area:3/2}
.croix .centre{grid-area:2/2;background:var(--creme);border:3px solid var(--k)}
.ab{display:flex;gap:16px;align-items:center}
.start{align-self:flex-end;margin-bottom:6px}
.start button{background:#3a2a32;color:var(--creme);border:3px solid var(--k);border-radius:999px;padding:7px 12px;font:9px "Press Start 2P",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
.start button.appui{background:#5a4450}
.ab button{width:64px;height:64px;border-radius:50%;font-size:18px;background:var(--rouge);color:var(--creme)}
.ab button[data-k=B]{transform:translateY(22px);background:var(--bord)}

.coordonnees{font-size:22px;text-align:center;line-height:1.3;opacity:.92}
.coordonnees a{color:var(--creme);text-decoration:none;border-bottom:1px solid rgba(255,230,193,.4)}
.coordonnees a:hover{border-color:var(--creme)}
.coordonnees span{margin:0 .5em;opacity:.5}
@media (max-width:600px){ .coordonnees{font-size:18px} .coordonnees span{display:block;height:0;overflow:hidden} }

@media (prefers-reduced-motion:reduce){ .vue{transition:opacity .2s} .titre .go,#dialogue-suite{animation:none} }

/* ── Éditeur (mode édition uniquement) ── */
.ed-bouton{position:fixed;left:14px;bottom:14px;z-index:79;background:#1d1d1f;color:#fff;border:0;border-radius:999px;padding:12px 20px;font:500 15px/1 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.editeur{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:80;display:flex;flex-direction:column;background:#fbfbfa;color:#1d1d1f;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:-10px 0 40px rgba(0,0,0,.3);transform:translateX(105%);transition:transform .25s}
.editeur.ouvert{transform:none}
.editeur:not(.ouvert){visibility:hidden}
html{overflow-x:hidden}
@media (min-width:1000px){ .edition-ouverte body{padding-right:452px} }
.ed-tete{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #e4e4e2}
.ed-tete strong{font-size:16px}
.ed-corps{flex:1;overflow:auto;padding:8px 18px 24px}
.ed-pied{padding:14px 18px;border-top:1px solid #e4e4e2;display:grid;gap:8px;background:#fff}
.ed-pied p{margin:0;color:#666;font-size:13px}
.editeur details{border-bottom:1px solid #e9e9e7;padding:6px 0}
.editeur summary{cursor:pointer;font-weight:600;font-size:15px;padding:8px 0}
.ed-champ{display:block;margin:10px 0}
.ed-champ>span{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px}
.ed-champ small{display:block;color:#777;margin-top:4px}
.editeur input[type=text],.editeur input[type=email],.editeur input[type=url],.editeur input[type=password],.editeur textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid #cfcfcc;border-radius:6px;padding:8px 10px}
.editeur textarea{resize:vertical}
.editeur input:focus,.editeur textarea:focus{outline:2px solid #2f6fde;outline-offset:0;border-color:transparent}
.ed-deux{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #cfcfcc;border-radius:6px;padding:6px 10px;font-size:13px;color:#1d1d1f;cursor:pointer}
.ed-btn:hover{background:#f0f0ee}
.ed-btn.danger{color:#b3261e}
.ed-btn.principal{background:#1d1d1f;color:#fff;border-color:#1d1d1f;justify-content:center;padding:10px;font-size:14px}
.ed-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ed-image-ligne{display:flex;gap:8px;align-items:center}
.ed-image-ligne img,.ed-vignette-vide{width:52px;height:52px;flex:none;object-fit:cover;border-radius:5px;background:#e9e9e7}
.ed-image-ligne em{color:#555}
.editeur .ed-carte{border:1px solid #e1e1de;border-radius:8px;padding:4px 12px 12px;margin:10px 0;background:#fff}
.ed-carte summary{font-size:14px}
.ed-paire{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin:6px 0}
.ed-note{margin:8px 0;padding:8px 10px;border-radius:6px;background:#fff6dd;color:#5c4400;font-size:13px}
.ed-statut{margin:0;font-size:13px}.ed-statut.ok{color:#1d7a3a}.ed-statut.erreur{color:#b3261e}
.ed-aide{margin:6px 0 0;padding-left:18px;color:#555;font-size:13px}
</style>
</head>
<body>
<main class="jeu" id="jeu" aria-label="Portfolio jouable">
  <canvas id="ecran" aria-label="Le couloir et la chambre de Tino, vus de dessus"></canvas>

  <div class="titre" id="titre" role="button" tabindex="0" aria-label="Commencer">
    <h1 id="titre-nom">TINO MIELE</h1>
    <div class="sous">PORTFOLIO</div>
    <div class="go" id="titre-go">▶ APPUYER SUR ENTRÉE</div>
  </div>

  <section class="vue" id="vue-bureau" hidden="" aria-label="Le bureau, avec les créations">
    <button class="vue-fermer" type="button" data-fermer="">B · RETOUR</button>
    <div class="plateau" id="plateau">
      <button class="fleche" type="button" data-nav="-1" aria-label="Création précédente">◀</button>
      <figure class="feuille"><div class="feuille-img" id="feuille-img"></div><figcaption><strong id="feuille-titre"></strong><span id="feuille-n"></span></figcaption></figure>
      <button class="fleche" type="button" data-nav="1" aria-label="Création suivante">▶</button>
    </div>
    <p class="aide-vue">◀ ▶ défiler · A : détails · B : retour</p>
  </section>

  <section class="vue" id="vue-pc" hidden="" aria-label="L'ordinateur">
    <button class="vue-fermer" type="button" data-fermer="">B · RETOUR</button>
    <div class="moniteur">
      <div class="ecran-pc"><div class="pc-zone" id="pc-zone"></div></div>
      <div class="moniteur-pied"><span>TINO·OS</span><i></i></div>
    </div>
    <p class="aide-vue">▲ ▼ choisir · A : ouvrir · B : retour</p>
  </section>

  <section class="vue" id="vue-borne" hidden="" aria-label="Borne d'arcade">
    <div class="borne-cadre">
      <div class="borne-haut" id="borne-titre"></div>
      <div class="borne-ecran"><iframe id="borne-jeu" title="Jeu" allow="autoplay; fullscreen; gamepad"></iframe></div>
      <div class="borne-bas"><button class="borne-btn" type="button" data-fermer="">QUITTER</button><a class="borne-btn" id="borne-onglet" target="_blank" rel="noopener">PLEIN ÉCRAN ↗</a></div>
    </div>
  </section>
  <section class="vue" id="vue-terra" hidden="" aria-label="Le terrarium">
    <button class="vue-fermer" type="button" data-fermer="">B · RETOUR</button>
    <div class="vitre"><canvas id="terra" width="960" height="600"></canvas></div>
    <p class="aide-vue" id="terra-aide">A ou toucher le pogona pour le caresser · B : retour</p>
  </section>

  <div class="dialogue" id="dialogue" hidden="" aria-live="polite"><p id="dialogue-texte"></p><span id="dialogue-suite" hidden="">▼</span></div>
  <div class="choix" id="choix" hidden=""><div data-c="0" class="sel">OUI</div><div data-c="1">NON</div></div>
  <div class="fondu" id="fondu"></div>
  <div class="boutons-haut"><button class="bouton-son" id="bouton-son" type="button" aria-label="Couper le son">♪ ON</button><button class="bouton-menu" id="bouton-menu" type="button">MENU</button></div>
  <div class="lieu" id="lieu" aria-live="polite"></div>
  <div class="menu" id="menu" hidden=""><div data-m="creations">CRÉATIONS</div><div data-m="cv">CV</div><div data-m="videos">VIDÉOS</div><div data-m="contact">CONTACT</div><div data-m="son">SON : OUI</div><div data-m="fermer">FERMER</div></div>
</main>

<div class="manette" id="manette" aria-hidden="true">
  <div class="croix"><button data-k="haut">▲</button><button data-k="gauche">◀</button><span class="centre"></span><button data-k="droite">▶</button><button data-k="bas">▼</button></div>

function plaque(g, p) {

/* ── Couloir ── */

const boite = $("#dialogue"), texteEl = $("#dialogue-texte"), suiteEl = $("#dialogue-suite"), choixEl = $("#choix");
let D = null;
function decouper(texte) {
  const fs = parseFloat(getComputedStyle(texteEl).fontSize) || 12, max = Math.max(14, Math.floor((texteEl.clientWidth || 300) / fs));
  const lignes = [];
  for (const l of String(texte).split("\n")) {
    let cur = "";
    for (const mot of l.split(" ")) { if (!cur) cur = mot; else if ((cur + " " + mot).length <= max) cur += " " + mot; else { lignes.push(cur); cur = mot; } }
    lignes.push(cur);
  }
  const pages = []; for (let i = 0; i < lignes.length; i += 2) pages.push(lignes.slice(i, i + 2).join("\n"));
  return pages;
}
function ouvrirBoite(texte, choix) {
  return new Promise(res => {
    texteEl.textContent = ""; suiteEl.hidden = true; choixEl.hidden = true; boite.hidden = false;
    const pages = decouper(texte);
    D = { pages, page: 0, texte: pages[0], n: 0, acc: 0, plein: false, choix, sel: 0, resolve: res };
    majChoix();
  });
}
const dire = t => ouvrirBoite(t, false);
const demander = t => ouvrirBoite(t, true);
const derniere = () => D.page >= D.pages.length - 1;
function majChoix() { choixEl.querySelectorAll("div").forEach((d, i) => d.classList.toggle("sel", i === D?.sel)); }
function remplir() { D.n = D.texte.length; D.plein = true; texteEl.textContent = D.texte; if (D.choix && derniere()) choixEl.hidden = false; else suiteEl.hidden = false; }
function pageSuivante() { D.page++; D.texte = D.pages[D.page]; D.n = 0; D.acc = 0; D.plein = false; texteEl.textContent = ""; suiteEl.hidden = true; }
function majDialogue(dt) {
  if (!D || D.plein) return;
  D.acc += dt; const n = Math.min(D.texte.length, Math.floor(D.acc / 22));
  if (n > D.n) { if (Math.floor(n / 3) > Math.floor(D.n / 3) && D.texte[n - 1] !== " ") Son.bip(620, .03, "square", .018); D.n = n; texteEl.textContent = D.texte.slice(0, n); }
  if (D.n >= D.texte.length) remplir();
}
function finirDialogue(val) { const r = D.resolve; D = null; boite.hidden = true; choixEl.hidden = true; r(val); }
function toucheDialogue(k) {
  if (!D.plein) { if (k === "A" || k === "B") remplir(); return; }
  if (!derniere()) { if (k === "A" || k === "B") { Son.bip(880, .04); pageSuivante(); } return; }

}

          <li>GitHub : Settings → Developer settings → Personal access tokens → Fine-grained tokens.</li>

        </ol>
        ${gh.jeton ? `<div class="ed-actions"><button type="button" class="ed-btn danger" data-action="oublier-gh">Oublier le jeton sur cet appareil</button></div>` : ""}`)}
    </div>
    <div class="ed-pied">
      ${ghPret() ? `<button type="button" class="ed-btn principal" data-action="enregistrer">Enregistrer sur le site</button>`
                 : `<button type="button" class="ed-btn principal" data-action="config-gh">Connecter GitHub pour enregistrer en ligne</button>`}

      <p>Poids actuel : ${poids()}. <button type="button" class="ed-btn" data-action="telecharger" style="padding:2px 8px">Télécharger une copie</button></p>

  ed.querySelector(".ed-corps").scrollTop = y;
}

function rafraichirJeu() { majCoordonnees(); majArcade(); if (vue === "bureau") rendreBureau(); if (vue === "pc" && pc.etat !== "lecture") rendrePC(); }
function modifie(reconstruire = false) {
  try { localStorage.setItem(CLE, JSON.stringify(S)); noteBrouillon = ""; }
  catch { noteBrouillon = "Le brouillon est trop lourd pour être gardé automatiquement : enregistre avant de fermer la page."; reconstruire = true; }
  rafraichirJeu(); if (reconstruire) construire();
}
ed.addEventListener("toggle", e => { const g = e.target.dataset?.groupe; if (g) e.target.open ? ouverts.add(g) : ouverts.delete(g); }, true);
ed.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.gh) {
    const avant = !!ghPret(); gh[t.dataset.gh] = t.value.trim(); garderGh();
    if (avant !== !!ghPret()) { const f = t.dataset.gh; construire(); const n = ed.querySelector(`[data-gh="${f}"]`); n?.focus(); n?.setSelectionRange?.(n.value.length, n.value.length); }
    return;
  }
  const p = t.dataset.path; if (!p) return;
  set(S, p, t.value);
  const carteEd = t.closest(".ed-carte"); if (carteEd && p.endsWith(".titre")) carteEd.querySelector(".ed-nom").textContent = t.value || "Sans titre";
  modifie();
});
function compresser(fichier, max) {
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onerror = ko;
    r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", .82)); }; img.src = r.result; };
    r.readAsDataURL(fichier);
  });
}
ed.addEventListener("change", async e => {
  const t = e.target; if (!t.files?.length || !t.dataset.fichier) return;
  try { set(S, t.dataset.fichier, await compresser(t.files[0], t.dataset.fichier === "cv.image" ? 2000 : 1600)); modifie(true); }
  catch { alert("Cette image n'a pas pu être lue. Essaie avec un fichier JPG ou PNG."); }
});
ed.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const act = b.dataset.action, i = +b.dataset.i;
  if (act === "fermer") { basculer(false); bouton.focus(); return; }
  if (act === "telecharger") return telecharger();
  if (act === "enregistrer") return enregistrer();
  if (act === "config-gh") {
    ouverts.add("github"); construire();
    ed.querySelector('[data-groupe="github"]').scrollIntoView({ block: "start" });
    ed.querySelector(`[data-gh="${!gh.proprietaire ? "proprietaire" : !gh.depot ? "depot" : "jeton"}"]`)?.focus(); return;
  }
  if (act === "oublier-gh") { delete gh.jeton; garderGh(); statutGh = ""; construire(); return; }
  if (act === "reinitialiser") {
    if (!confirm("Revenir au contenu du fichier d'origine ? Les modifications non enregistrées seront perdues.")) return;
    Object.keys(S).forEach(k => delete S[k]); Object.assign(S, JSON.parse(JSON.stringify(ORIGINE)));
    try { localStorage.removeItem(CLE); } catch {}
    noteBrouillon = ""; rafraichirJeu(); construire(); return;
  }
  if (act === "vider") set(S, b.dataset.path, "");
  if (act === "suppr") { if (b.dataset.confirmer && !confirm(b.dataset.confirmer)) return; get(S, b.dataset.liste).splice(i, 1); }
  if (act === "monter" || act === "descendre") {
    const j = act === "monter" ? i - 1 : i + 1, L = S.creations; [L[i], L[j]] = [L[j], L[i]];
    const oi = ouverts.has("c" + i), oj = ouverts.has("c" + j); ouverts.delete("c" + i); ouverts.delete("c" + j); if (oi) ouverts.add("c" + j); if (oj) ouverts.add("c" + i);
  }
  if (act === "ajout-creation") { S.creations.push({ titre: "Nouvelle création", image: "", description: "" }); ouverts.add("c" + (S.creations.length - 1)); }
  if (act === "ajout-video") S.videos.push({ titre: "Nouvelle vidéo", url: "" });
  if (act === "ajout-jeu" && S.jeux.length < 7) { S.jeux.push({ titre: "Nouveau jeu", fronton: "NOUVEAU", url: "", icone: "autre" }); ouverts.add("jeux"); ouverts.add("j" + (S.jeux.length - 1)); }
  if (act === "ajout-musique") S.musiques.push({ titre: "Nouvelle musique", url: "" });
  modifie(true);
});

function genererHTML() {
  const debut = SOURCE.indexOf("const SITE = "), fin = SOURCE.indexOf("/* ═══════════════════ FIN DE LA ZONE", debut);
  const json = JSON.stringify(S, null, 2).replace(/<\/(script)/gi, "<\\/$1");
  return SOURCE.slice(0, debut) + `const SITE = ${json};\n` + SOURCE.slice(fin);
}
function telecharger() {
  const url = URL.createObjectURL(new Blob([genererHTML()], { type: "text/html" }));
  const a = document.createElement("a"); a.href = url; a.download = "index.html"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function enBase64(texte) {
  const o = new TextEncoder().encode(texte); let bin = "";
  for (let i = 0; i < o.length; i += 0x8000) bin += String.fromCharCode.apply(null, o.subarray(i, i + 0x8000));
  return btoa(bin);
}
let enCours = false;
async function enregistrer() {
  if (enCours) return;
  enCours = true; statutGh = "Enregistrement en cours…"; classeStatut = ""; construire();
  const api = `https://api.github.com/repos/${encodeURIComponent(gh.proprietaire)}/${encodeURIComponent(gh.depot)}/contents/${gh.chemin.split("/").map(encodeURIComponent).join("/")}`;
  const ent = { "Authorization": "Bearer " + gh.jeton, "X-GitHub-Api-Version": "2022-11-28" };
  try {
    let sha;
    const r1 = await fetch(`${api}?ref=${encodeURIComponent(gh.branche)}&t=${Date.now()}`, { headers: { ...ent, "Accept": "application/vnd.github.object" }, cache: "no-store" });
    if (r1.ok) sha = (await r1.json()).sha; else if (r1.status !== 404) throw r1;
    const r2 = await fetch(api, { method: "PUT", headers: { ...ent, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Mise à jour du portfolio depuis l'éditeur", content: enBase64(genererHTML()), branch: gh.branche, ...(sha ? { sha } : {}) }) });
    if (!r2.ok) throw r2;
    Object.keys(ORIGINE).forEach(k => delete ORIGINE[k]); Object.assign(ORIGINE, JSON.parse(JSON.stringify(S)));
    try { localStorage.removeItem(CLE); } catch {}
    noteBrouillon = ""; statutGh = "Enregistré. Le site en ligne se met à jour d'ici une minute environ."; classeStatut = "ok";
  } catch (err) {
    const c = err?.status;
    statutGh = c === 401 ? "GitHub refuse le jeton. Vérifie qu'il est bien copié et qu'il n'a pas expiré."
      : c === 403 ? "Le jeton n'a pas le droit d'écrire. Donne-lui la permission Contents en « Read and write »."
      : c === 404 ? "Dépôt introuvable. Vérifie le compte, le nom du dépôt et la branche."
      : c === 409 ? "Le fichier a changé sur GitHub entre-temps. Réessaie."
      : c === 422 ? "GitHub a refusé le fichier. S'il est très lourd, retire quelques images."
      : "L'enregistrement n'a pas abouti. Vérifie ta connexion et réessaie.";
    classeStatut = "erreur";
  } finally { enCours = false; construire(); }
}
construire();
if (location.hash === "#editer") basculer(true);
})();
